name: pyqir-manylinux-$(BuildId)

trigger:
  branches:
    include:
    - main

parameters:
- name: matrix
  type: object
  default:
  - name: linux_x86_64
    poolName: 'Azure-Pipelines-DevTools-EO'
    imageName: 'ubuntu-22.04'
    os: linux
    tag: amd64
  - name: linux_aarch64
    poolName: 'Azure-Pipelines-DevTools-ARM64-EO'
    imageName: 'azurelinux-3.0-gen2-arm64'
    os: linux
    tag: arm64

# Parameters for building PyQIR
- name: ACR_SERVER
  displayName: Azure Container Registry server
  type: string
  default: 'qdkacr-cfgqhwddajdaebhg.azurecr.io'
- name: qdkRustTag
  displayName: Tag for the qdk-rust container image
  type: string
  default: 'latest'


resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  containers:
    - container: qdkRust
      image: ${{ parameters.ACR_SERVER }}/qdk-rust:${{ parameters.qdkRustTag }}
      endpoint: qdkacr

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
      # To fetch the Universal Package from the ADO feed, Azure blob access is needed.
      # See https://eng.ms/docs/cloud-ai-platform/devdiv/one-engineering-system-1es/1es-build/cloudbuild/security/1espt-network-isolation
      networkIsolationPolicy: AzureStorage

    sdl:
      autobaseline:
        enableForGitHub: true
      sourceAnalysisPool:
        name: 'Azure-Pipelines-DevTools-EO'
        image: windows-2022
        os: windows
    stages:
    - stage: build
      displayName: Build
      jobs:
      - ${{ each target in parameters.matrix }}:
        - job: ${{ target.name }}
          pool:
            name: ${{ target.poolName }}
            image: ${{ target.imageName }}
            os: ${{ target.os }}
          timeoutInMinutes: 300
          templateContext:
            authenticatedContainerRegistries:
            - serviceConnection: qdkacr
          steps:
          - checkout: self

          # Make available the authenticated pip feed variable (PIP_INDEX_URL)
          - task: PipAuthenticate@1
            displayName: Pip Authenticate
            inputs:
              artifactFeeds: 'AzureQuantum/azure-quantum'
          
          - script: |
              set -euxo pipefail

              python -m venv .venv
              source .venv/bin/activate
              python -m pip install "maturin~=1.15.0"

              mkdir -p .cargo/
              cat > ".cargo/config.toml" <<EOF
              [source.crates-io]
              replace-with = "ms-crates-io"

              [source.ms-crates-io]
              registry = "$(cratesIoFeedOverride)"
              EOF

              pwd
              ls -lF .
              cargo fetch

              cd qirlib
              export QIRLIB_CACHE_DIR=$LLVM_SYS_201_PREFIX
              cargo test  --release --features llvm20-1
              cargo build --release --features llvm20-1
              cd ..

              python -m build --verbose --wheel \
                --config-setting=build-args="--features llvm20-1 --compatibility" pyqir
              
              ls -lF target/wheels

            target: qdkRust
            displayName: Test Rust build
            env:
              PIP_INDEX_URL: $(PIP_INDEX_URL)
              CARGO_REGISTRIES_MS_CRATES_IO_INDEX: $(cratesIoFeedOverride)
              CARGO_REGISTRIES_MS_CRATES_IO_TOKEN: $(System.AccessToken)
              CARGO_REGISTRIES_MS_CRATES_IO_CREDENTIAL_PROVIDER: cargo:token

          # - script: |
          #     set -euxo pipefail
          #     source .venv/bin/activate
          #     python -m pip list
          #   target: qdkLlvm
          #   displayName: Verify pip install
          #   env:
          #     PIP_INDEX_URL: $(PIP_INDEX_URL)

          # - script: |
          #     set -euxo pipefail
          #     cat /etc/redhat-release
          #     uname -m
          #     python --version
          #   target: qdkImage
          #   displayName: Verify Environment
          # - task: RustInstaller@1
          #   inputs:
          #     rustVersion: ms-prod-$(RUST_TOOLCHAIN_VERSION)
          #     ${{ if target.additionalRustTargets }}:
          #       additionalTargets: ${{ target.additionalRustTargets }}
          #     cratesIoFeedOverride: $(cratesIoFeedOverride)
          #     toolchainFeed: $(toolchainFeed)
          #   displayName: Install Rust toolchain

          # - script: |
          #     ls target/wheels/*
          #   displayName: List Py Packages on non-Win
          #   condition: and(succeeded(), ne(variables['Agent.OS'], 'Windows_NT'))
