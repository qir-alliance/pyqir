name: pyqir-manylinux-$(BuildId)

trigger:
  branches:
    include:
    - main

parameters:
- name: matrix
  type: object
  default:
  - name: linux_x86_64
    poolName: 'Azure-Pipelines-DevTools-EO'
    imageName: 'ubuntu-22.04'
    os: linux
    arch: x86_64
    tag: amd64
  - name: linux_aarch64
    poolName: 'Azure-Pipelines-DevTools-ARM64-EO'
    imageName: 'azurelinux-3.0-gen2-arm64'
    os: linux
    arch: aarch64
    tag: arm64

# Parameters for building PyQIR
- name: ACR_SERVER
  displayName: Azure Container Registry server
  type: string
  default: 'qdkacr-cfgqhwddajdaebhg.azurecr.io'
- name: qdkBuildTag
  displayName: Tag for the qdk-build container image
  type: string
  default: 'latest'


resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  containers:
    - container: qdkBuild
      image: ${{ parameters.ACR_SERVER }}/qdk-build:${{ parameters.qdkBuildTag }}
      endpoint: qdkacr

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
      # To fetch the Universal Package from the ADO feed, Azure blob access is needed.
      # See https://eng.ms/docs/cloud-ai-platform/devdiv/one-engineering-system-1es/1es-build/cloudbuild/security/1espt-network-isolation
      networkIsolationPolicy: AzureStorage

    sdl:
      autobaseline:
        enableForGitHub: true
      sourceAnalysisPool:
        name: 'Azure-Pipelines-DevTools-EO'
        image: windows-2022
        os: windows
    stages:
    - stage: build
      displayName: Build
      jobs:
      - ${{ each target in parameters.matrix }}:
        - job: ${{ target.name }}
          pool:
            name: ${{ target.poolName }}
            image: ${{ target.imageName }}
            os: ${{ target.os }}
            ${{ if eq(target.arch, 'aarch64') }}:
              hostArchitecture: Arm64
          variables:
            arch: ${{ target.arch }}
          timeoutInMinutes: 300
          templateContext:
            authenticatedContainerRegistries:
            - serviceConnection: qdkacr
            outputs:
            - output: pipelineArtifact
              displayName: 'Upload Python Artifacts for ${{ target.os }} ${{ target.arch }}'
              condition: succeeded()
              targetPath: $(System.DefaultWorkingDirectory)/target/wheels
              artifactName: wheel.${{ target.os }}.${{ target.arch }}
          steps:
          - checkout: self

          # Make available the authenticated pip feed variable (PIP_INDEX_URL)
          - task: PipAuthenticate@1
            displayName: Pip Authenticate
            inputs:
              artifactFeeds: 'AzureQuantum/azure-quantum'
          
          # The image CARGO_HOME is only root writable, so need to create a local CARGO_HOME directory
          # Also write a local .cargo/config.toml to override the crates.io source
          - script: |
              set -euxo pipefail

              python3 -m venv .venv
              source .venv/bin/activate
              python -m pip install build "maturin~=1.15.0"

              mkdir -p .cargo_home/
              export CARGO_HOME=$(pwd)/.cargo_home

              mkdir -p .cargo/
              cat > ".cargo/config.toml" <<EOF
              [source.crates-io]
              replace-with = "ms-crates-io"

              [source.ms-crates-io]
              registry = "$(cratesIoFeedOverride)"
              EOF

              pwd
              ls -lF .
              cargo fetch

              cd qirlib
              export QIRLIB_CACHE_DIR=$LLVM_SYS_201_PREFIX
              cargo test  --release --features llvm20-1
              cargo build --release --features llvm20-1
              cd ..

              # See https://www.maturin.rs/bindings#py_limited_apiabi3
              maturin build \
                  --manifest-path pyqir/Cargo.toml \
                  --release \
                  --features llvm20-1 \
                  --compatibility manylinux_2_28 \
                  --interpreter python3.11

              maturin build \
                  --manifest-path pyqir/Cargo.toml \
                  --release \
                  --features llvm20-1 \
                  --compatibility manylinux_2_28 \
                  --interpreter python3.15t
              
              ls -lF target/wheels

            target: qdkBuild
            displayName: Build with qdk-build container
            env:
              PIP_INDEX_URL: $(PIP_INDEX_URL)
              # See https://eng.ms/docs/coreai/devdiv/one-engineering-system-1es/1es-docs/azure-artifacts/cargo
              CARGO_REGISTRIES_MS_CRATES_IO_INDEX: $(cratesIoFeedOverride)
              CARGO_REGISTRIES_MS_CRATES_IO_TOKEN: Bearer $(System.AccessToken)
              CARGO_REGISTRIES_MS_CRATES_IO_CREDENTIAL_PROVIDER: cargo:token
