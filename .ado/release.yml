name: pyqir-publish-$(BuildId)

# This pipeline is used to build and publish the PyQIR package
# It uses a Microsoft ADO template for additional security checks.

# Run on merges to main to ensure that the latest code
# is always able to be published.
trigger:
  branches:
    include:
    - main

# Run the pipeline every day at 5:00 AM to ensure
# codeql and other governance checks are up-to-date.
schedules:
- cron: "0 5 * * *"
  displayName: 'Build for Component Governance'
  branches:
    include:
    - main
  always: true


variables:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN_VERSION: "1.93"
  PYTHON_VERSION: "3.11"
  PYTHON_315_PREBUILT_VERSION: "3.15.0-rc.3"
  PYTHON_315T_WINDOWS_PACKAGE_VERSION: "3.15.0"
  LLVM_VERSION: 20
  # use this to invalidate the cache. Any time we update the OS
  # image, we should increment this to ensure that the cache is rebuilt.
  CACHE_COUNTER: 10

parameters:
- name: matrix
  type: object
  default:
  - name: linux_x86_64
    poolName: 'Azure-Pipelines-DevTools-EO'
    imageName: 'ubuntu-22.04'
    os: linux
    arch: x86_64
  - name: linux_aarch64
    poolName: 'Azure-Pipelines-DevTools-ARM64-EO'
    imageName: 'azurelinux-3.0-gen2-arm64'
    os: linux
    arch: aarch64
  - name: mac_x86_64
    poolName: 'Azure Pipelines'
    imageName: 'macOS-15'
    os: macOS
    arch: x86_64
    python315tExpectedVersion: "3.15.0rc3"
    python315tAssetUrl: "https://github.com/actions/python-versions/releases/download/3.15.0-rc.3-37256039299/python-3.15.0-rc.3-darwin-x64-freethreaded.tar.gz"
    python315tAssetSha256Variable: PYTHON_315T_MACOS_X64_SHA256
    python315tToolcacheArch: x64-freethreaded
  - name: mac_aarch64
    poolName: 'AcesShared'
    os: macOS
    arch: aarch64
    python315tExpectedVersion: "3.15.0rc3"
    python315tAssetUrl: "https://github.com/actions/python-versions/releases/download/3.15.0-rc.3-37256039299/python-3.15.0-rc.3-darwin-arm64-freethreaded.tar.gz"
    python315tAssetSha256Variable: PYTHON_315T_MACOS_ARM64_SHA256
    python315tToolcacheArch: arm64-freethreaded
  - name: windows_x86_64
    poolName: 'Azure-Pipelines-DevTools-EO'
    imageName: 'windows-2022'
    os: windows
    arch: x86_64
    python315tExpectedVersion: "3.15.0"
    python315tWindowsPackageName: python-315t-amd64
    python315tWindowsZip: pythoncore-3.15t-64-3.15.0.zip
  - name: windows_aarch64
    poolName: 'Azure-Pipelines-DevTools-ARM64-EO'
    imageName: 'windows-2025-gen2-arm64'
    os: windows
    arch: aarch64
    python315tExpectedVersion: "3.15.0"
    python315tWindowsPackageName: python-315t-arm64
    python315tWindowsZip: pythoncore-3.15t-arm64-3.15.0.zip

# Parameters for building PyQIR
- name: ACR_SERVER
  displayName: Azure Container Registry server
  type: string
  default: 'qdkacr-cfgqhwddajdaebhg.azurecr.io'
- name: qdkBuildTag
  displayName: Tag for the qdk-build container image
  type: string
  default: 'latest'

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  containers:
    - container: qdkBuild
      image: ${{ parameters.ACR_SERVER }}/qdk-build:${{ parameters.qdkBuildTag }}
      endpoint: qdkacr

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
      networkIsolationPolicy: GitHub,AzureStorage
    sdl:
      autobaseline:
        enableForGitHub: true
      sourceAnalysisPool:
        name: 'Azure-Pipelines-DevTools-EO'
        image: windows-2022
        os: windows
    stages:
    - stage: build
      displayName: Build
      jobs:
      - ${{ each target in parameters.matrix }}:
        - job: ${{ target.name }}
          pool:
            name: ${{ target.poolName }}
            image: ${{ target.imageName }}
            os: ${{ target.os }}
            ${{ if eq(target.arch, 'aarch64') }}:
              hostArchitecture: Arm64
            ${{ if eq(target.poolName, 'AcesShared') }}:
              demands:
              - ImageOverride -equals ACES_VM_SharedPool_Sequoia
          variables:
            arch: ${{ target.arch }}
            ${{ if target.python315tExpectedVersion }}:
              PYTHON_315T_EXPECTED_RUNTIME_VERSION: ${{ target.python315tExpectedVersion }}
            ${{ if target.python315tAssetUrl }}:
              PYTHON_315T_ASSET_URL: ${{ target.python315tAssetUrl }}
              PYTHON_315T_ASSET_SHA256_VARIABLE: ${{ target.python315tAssetSha256Variable }}
              PYTHON_315T_TOOLCACHE_ARCH: ${{ target.python315tToolcacheArch }}
            ${{ if target.python315tWindowsPackageName }}:
              PYTHON_315T_WINDOWS_PACKAGE_NAME: ${{ target.python315tWindowsPackageName }}
              PYTHON_315T_WINDOWS_ZIP: ${{ target.python315tWindowsZip }}
            ${{ if eq(target.os, 'windows') }}:
                LLVM_DIRECTORY: $(Build.SourcesDirectory)\target\llvm
            ${{ else }}:
                LLVM_DIRECTORY: $(Build.SourcesDirectory)/target/llvm
          timeoutInMinutes: 300
          templateContext:
            ${{ if eq(target.os, 'linux') }}:
              authenticatedContainerRegistries:
              - serviceConnection: qdkacr
            outputs:
            - output: pipelineArtifact
              displayName: 'Upload Python Artifacts for ${{ target.os }} ${{ target.arch }}'
              condition: succeeded()
              targetPath: $(System.DefaultWorkingDirectory)/target/wheels
              artifactName: wheel.${{ target.os }}.${{ target.arch }}
          steps:
          - task: PipAuthenticate@1
            displayName: Pip Authenticate
            inputs:
              artifactFeeds: 'AzureQuantum/azure-quantum'

          # Build PyQIR in the Linux containers. Do this before the steps that install Python, Rust, etc.
          # on the host agent, as these can get added to the PATH in the container and mess with the build
          # if it finds the wrong tool versions.
          - ${{ if eq(target.os, 'linux') }}:
            - script: |
                set -euxo pipefail

                python3 -m venv .venv
                source .venv/bin/activate
                python -m pip install build "maturin~=1.15.0"

                mkdir -p .cargo/
                export CARGO_HOME=$(pwd)/.cargo
                cat > ".cargo/config.toml" <<EOF
                [source.crates-io]
                replace-with = "ms-crates-io"

                [source.ms-crates-io]
                registry = "$(cratesIoFeedOverride)"
                EOF

                cd qirlib
                export QIRLIB_CACHE_DIR=$LLVM_SYS_201_PREFIX
                cargo test  --release --features llvm20-1
                cargo build --release --features llvm20-1
                cd ..

                # See https://www.maturin.rs/bindings#py_limited_apiabi3
                maturin build \
                    --manifest-path pyqir/Cargo.toml \
                    --release \
                    --features llvm20-1 \
                    --compatibility manylinux_2_28 \
                    --interpreter python3.11

                maturin build \
                    --manifest-path pyqir/Cargo.toml \
                    --release \
                    --features llvm20-1 \
                    --compatibility manylinux_2_28 \
                    --interpreter python3.15t
              displayName: Build PyQIR in Linux containers
              target: qdkBuild
              env:
                PIP_INDEX_URL: $(PIP_INDEX_URL)
                # See https://eng.ms/docs/coreai/devdiv/one-engineering-system-1es/1es-docs/azure-artifacts/cargo
                CARGO_REGISTRIES_MS_CRATES_IO_INDEX: $(cratesIoFeedOverride)
                CARGO_REGISTRIES_MS_CRATES_IO_TOKEN: Bearer $(System.AccessToken)
                CARGO_REGISTRIES_MS_CRATES_IO_CREDENTIAL_PROVIDER: cargo:token

          # We don't need Rust if the build happened in the Linux container
          - ${{ if ne(target.os, 'linux') }}:
            - task: RustInstaller@1
              inputs:
                rustVersion: ms-prod-$(RUST_TOOLCHAIN_VERSION)
                ${{ if target.additionalRustTargets }}:
                  additionalTargets: ${{ target.additionalRustTargets }}
                cratesIoFeedOverride: $(cratesIoFeedOverride)
                toolchainFeed: $(toolchainFeed)
              displayName: Install Rust toolchain

            - script: |
                rustc --version
                rustc --print target-list
              displayName: View rust target info

          # We need Python on the host VM regardless of the container build to run tests and examples
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)
              ${{ if eq(target.arch, 'aarch64') }}:
                architecture: "arm64"
            condition: and(succeeded(), not(and(eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))))

          # UsePythonVersion@0 does not support aarch64, so we install Python manually
          # using tdnf on Azure Linux 3.0 aarch64
          # We also need alias python3 as python
          - script: |
              sudo tdnf install python3-3.12.9 python3-pip-24.2 -y
              sudo alternatives --install /usr/bin/python python /usr/bin/python3 1
            displayName: Install Python on Azure Linux 3.0 aarch64
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))

          # Build or restore LLVM - not needed for Linux builds where it is already in the container
          - ${{ if ne(target.os, 'linux') }}:
            - pwsh: New-Item -ItemType Directory -Path $(LLVM_DIRECTORY) -Force
              displayName: Ensure cache dir exists

            - task: Cache@2
              inputs:
                key: '"llvm-$(LLVM_VERSION)-${{ target.os }}-${{ target.arch }}-$(CACHE_COUNTER)"'
                restoreKeys: '"llvm-$(LLVM_VERSION)-${{ target.os }}-${{ target.arch }}-$(CACHE_COUNTER)"'
                path: $(LLVM_DIRECTORY)
                cacheHitVar: CACHE_RESTORED
              displayName: Cache LLVM

            - pwsh: |
                git config --global core.longpaths true

                $directory = Resolve-Path $(LLVM_DIRECTORY)

                # Tell the build where LLVM is installed
                # This is usually automatic, but we are using a different directory than the default
                Write-Host "##vso[task.setvariable variable=QIRLIB_LLVM_EXTERNAL_DIR;]$directory"

                # Tell the build what llvm feature version to use
                $feature = "llvm$(LLVM_VERSION)-1"
                $variableName = "LLVM_SYS_$(LLVM_VERSION)1_PREFIX"
                Write-Host "##vso[task.setvariable variable=PYQIR_LLVM_FEATURE_VERSION;]$feature"

                # Tell LLVM-SYS where LLVM is installed
                Write-Host "##vso[task.setvariable variable=$variableName;]$directory"

                # Tell the qirlib build where to cache the LLVM directory and to not download LLVM
                Write-Host "##vso[task.setvariable variable=QIRLIB_CACHE_DIR;]$directory"
                Write-Host "##vso[task.setvariable variable=QIRLIB_DOWNLOAD_LLVM;]false"
              displayName: Configure Environment

            - script: |
                brew install cmake ninja ccache
              displayName: Install build dependencies
              condition: and(succeeded(), eq(variables['Agent.OS'], 'Darwin'), ne(variables.CACHE_RESTORED, 'true'))

            # build and install LLVM
            - pwsh: ./build.ps1 -t install-llvm-from-source
              displayName: Build and Install LLVM
              condition: and(succeeded(), ne(variables.CACHE_RESTORED, 'true'))

            # Build PyQIR on Mac and Windows
            - pwsh: ./build.ps1
              displayName: Build

            - task: UniversalPackages@1
              inputs:
                command: download
                feed: 'AzureQuantum/azure-quantum'
                packageName: $(PYTHON_315T_WINDOWS_PACKAGE_NAME)
                packageVersion: $(PYTHON_315T_WINDOWS_PACKAGE_VERSION)
                directory: $(Agent.TempDirectory)\python-3.15t-package-$(System.JobId)
              displayName: Download Python 3.15t runtime package
              condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'))

            - pwsh: |
                $packageDirectory = Join-Path "$(Agent.TempDirectory)" "python-3.15t-package-$(System.JobId)"
                $expectedZip = $env:PYTHON_315T_WINDOWS_ZIP
                if ([string]::IsNullOrWhiteSpace($expectedZip)) {
                  throw "Missing the expected Python 3.15t runtime ZIP name for this Windows target."
                }

                $zipMatches = @(
                  Get-ChildItem -LiteralPath $packageDirectory -Filter $expectedZip -File -Recurse
                )
                if ($zipMatches.Count -ne 1) {
                  $matchingPaths = $zipMatches.FullName -join ", "
                  throw "Expected exactly one $expectedZip under $packageDirectory, found $($zipMatches.Count): $matchingPaths"
                }
                $runtimeZip = $zipMatches[0].FullName
                Write-Host "Python 3.15t runtime ZIP: $runtimeZip"

                $runtimeDirectory = Join-Path "$(Agent.TempDirectory)" "python-3.15t-runtime-$(System.JobId)"
                if (Test-Path -LiteralPath $runtimeDirectory) {
                  Remove-Item -LiteralPath $runtimeDirectory -Recurse -Force -ErrorAction Stop
                }
                New-Item -ItemType Directory -Path $runtimeDirectory | Out-Null
                Expand-Archive -LiteralPath $runtimeZip -DestinationPath $runtimeDirectory

                $pythonExecutableMatches = @(
                  Get-ChildItem -LiteralPath $runtimeDirectory -Filter "python3.15t.exe" -File -Recurse
                )
                if ($pythonExecutableMatches.Count -ne 1) {
                  $matchingPaths = $pythonExecutableMatches.FullName -join ", "
                  throw "Expected exactly one python3.15t.exe in $expectedZip, found $($pythonExecutableMatches.Count): $matchingPaths"
                }
                $pythonExecutable = $pythonExecutableMatches[0].FullName

                $stableAbiDll = Join-Path (Split-Path -Parent $pythonExecutable) "python3t.dll"
                if (!(Test-Path -LiteralPath $stableAbiDll -PathType Leaf)) {
                  throw "python3t.dll was not found beside $pythonExecutable."
                }

                Write-Host "Python 3.15t executable: $pythonExecutable"
                Write-Host "##vso[task.setvariable variable=PYTHON_315T_EXECUTABLE]$pythonExecutable"
              displayName: Extract Python 3.15t runtime
              condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'))

            - pwsh: |
                $assetUrl = $env:PYTHON_315T_ASSET_URL
                $expectedSha256Variable = $env:PYTHON_315T_ASSET_SHA256_VARIABLE
                $toolcacheArchitecture = $env:PYTHON_315T_TOOLCACHE_ARCH
                if ([string]::IsNullOrWhiteSpace($assetUrl) -or
                    [string]::IsNullOrWhiteSpace($expectedSha256Variable) -or
                    [string]::IsNullOrWhiteSpace($toolcacheArchitecture)) {
                  throw "Missing pinned Python 3.15t asset metadata for this target."
                }

                $expectedSha256 = [Environment]::GetEnvironmentVariable($expectedSha256Variable)
                if ($expectedSha256 -notmatch "^[a-fA-F0-9]{64}$") {
                  throw "Define the non-secret ADO pipeline variable $expectedSha256Variable with the published SHA-256 for this Python 3.15t asset."
                }

                $assetName = [System.IO.Path]::GetFileName(([Uri]$assetUrl).AbsolutePath)
                $downloadDirectory = Join-Path "$(Agent.TempDirectory)" "python-3.15t-download-$(System.JobId)"
                $extractDirectory = Join-Path "$(Agent.TempDirectory)" "python-3.15t-extract-$(System.JobId)"
                foreach ($directory in @($downloadDirectory, $extractDirectory)) {
                  if (Test-Path $directory) {
                    Remove-Item -Path $directory -Recurse -Force -ErrorAction Stop
                  }
                  New-Item -ItemType Directory -Path $directory -Force | Out-Null
                }
                $assetPath = Join-Path $downloadDirectory $assetName

                Write-Host "Downloading pinned Python 3.15t asset: $assetUrl"
                Invoke-WebRequest -Uri $assetUrl -OutFile $assetPath
                $actualSha256 = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($actualSha256 -ne $expectedSha256.ToLowerInvariant()) {
                  throw "SHA-256 mismatch for ${assetName}: expected $expectedSha256, got $actualSha256."
                }
                Write-Host "Verified SHA-256 for ${assetName}: $actualSha256"

                if (!$assetName.EndsWith(".tar.gz", [StringComparison]::OrdinalIgnoreCase)) {
                  throw "Unsupported Python 3.15t asset format: $assetName"
                }
                & tar -xzf $assetPath -C $extractDirectory
                if ($LASTEXITCODE -ne 0) {
                  throw "Failed to extract $assetName."
                }

                $setupScriptMatches = @(
                  Get-ChildItem -Path $extractDirectory -Filter "setup.sh" -File -Recurse
                )
                if ($setupScriptMatches.Count -ne 1) {
                  $matchingNames = $setupScriptMatches.FullName -join ", "
                  throw "Expected exactly one setup.sh in $assetName, found $($setupScriptMatches.Count): $matchingNames"
                }

                $toolDirectory = "$(Agent.ToolsDirectory)"
                if ([string]::IsNullOrWhiteSpace($toolDirectory)) {
                  throw "Agent.ToolsDirectory is required to install the Python 3.15t distribution."
                }
                $env:AGENT_TOOLSDIRECTORY = $toolDirectory

                Push-Location $setupScriptMatches[0].DirectoryName
                try {
                  & bash $setupScriptMatches[0].FullName
                  if ($LASTEXITCODE -ne 0) {
                    throw "Python 3.15t setup failed with exit code $LASTEXITCODE."
                  }
                }
                finally {
                  Pop-Location
                }

                $installDirectory = Join-Path $toolDirectory "Python/$(PYTHON_315_PREBUILT_VERSION)/$toolcacheArchitecture"
                $pythonExecutable = Join-Path $installDirectory "bin/python"
                if (!(Test-Path -LiteralPath $pythonExecutable -PathType Leaf)) {
                  throw "Python 3.15t executable not found at $pythonExecutable."
                }

                Write-Host "Python 3.15t executable: $pythonExecutable"
                Write-Host "##vso[task.setvariable variable=PYTHON_315T_EXECUTABLE]$pythonExecutable"
              displayName: Install pinned Python 3.15t distribution
              condition: and(succeeded(), eq(variables['Agent.OS'], 'Darwin'))

            - pwsh: |
                $pythonExecutable = "$(PYTHON_315T_EXECUTABLE)"
                if ([string]::IsNullOrWhiteSpace($pythonExecutable) -or
                    !(Test-Path -LiteralPath $pythonExecutable -PathType Leaf)) {
                  throw "Python 3.15t executable not found at $pythonExecutable."
                }

                $expectedVersion = "$(PYTHON_315T_EXPECTED_RUNTIME_VERSION)"
                $expectedOperatingSystem = switch ("$(Agent.OS)") {
                  "Windows_NT" { "Windows" }
                  "Darwin" { "Darwin" }
                  default { throw "Unsupported operating system for Python 3.15t: $(Agent.OS)" }
                }
                $expectedPlatform = switch ("$(Agent.OS)") {
                  "Windows_NT" {
                    switch ("$(arch)") {
                      "x86_64" { "win-amd64" }
                      "aarch64" { "win-arm64" }
                      default { throw "Unsupported Windows architecture for Python 3.15t: $(arch)" }
                    }
                  }
                  default { "any" }
                }

                Write-Host "Validating Python 3.15t interpreter: $pythonExecutable"
                & $pythonExecutable -VV
                if ($LASTEXITCODE -ne 0) {
                  throw "Python 3.15t version check failed."
                }
                & $pythonExecutable -c 'import platform, sys, sysconfig; expected_arch = sys.argv[1].lower(); expected_version = sys.argv[2]; expected_os = sys.argv[3].lower(); expected_platform = sys.argv[4].lower(); actual_arch = platform.machine().lower(); actual_version = platform.python_version(); actual_os = platform.system().lower(); actual_platform = sysconfig.get_platform().lower(); allowed_arches = {"x86_64": {"x86_64", "amd64"}, "aarch64": {"aarch64", "arm64"}}; print("Executable:", sys.executable); print("Version:", sys.version); print("Operating system:", actual_os); print("Architecture:", actual_arch); print("Platform:", actual_platform); print("Py_GIL_DISABLED:", sysconfig.get_config_var("Py_GIL_DISABLED")); assert actual_version == expected_version; assert actual_os == expected_os; assert actual_arch in allowed_arches[expected_arch]; assert expected_platform in ("any", actual_platform); assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1' "$(arch)" $expectedVersion $expectedOperatingSystem $expectedPlatform
                if ($LASTEXITCODE -ne 0) {
                  throw "Python 3.15t interpreter verification failed."
                }
              displayName: Validate Python 3.15t interpreter

            - pwsh: |
                $pythonExecutable = "$(PYTHON_315T_EXECUTABLE)"
                python -m pip install "maturin~=1.15.0"
                if ($LASTEXITCODE -ne 0) {
                  throw "Failed to install Maturin."
                }
                python -m maturin build `
                  --manifest-path pyqir/Cargo.toml `
                  --release `
                  --features llvm20-1 `
                  --interpreter $pythonExecutable
                if ($LASTEXITCODE -ne 0) {
                  throw "Failed to build the ABI3T wheel with Python 3.15t."
                }
              displayName: Build ABI3T wheel with Python 3.15t

          - ${{ else }}:
            # Run the tests and examples outside the container for the Linux builds
            - pwsh: ./eng/build.ps1 -taskList test,run-examples
              displayName: Run Tests and Examples for Linux Builds

          - script: |
              dir target\wheels\*
            displayName: List Py Packages on Win
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'))

          - script: |
              ls target/wheels/*
            displayName: List Py Packages on non-Win
            condition: and(succeeded(), ne(variables['Agent.OS'], 'Windows_NT'))

    - stage: approval
      displayName: Approval
      dependsOn: build
      condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
      jobs:
      - job: "Approval"
        pool: server
        timeoutInMinutes: 1440 # job times out in 1 day
        steps:
        - task: ManualValidation@0
          timeoutInMinutes: 1440 # task times out in 1 day
          inputs:
            notifyUsers: ''
            instructions: 'Please verify artifacts and approve the release'
            onTimeout: 'reject'

    - stage: release
      displayName: Release
      dependsOn: approval
      condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
      jobs:
      # We will get a warning about extra files in the sbom validation saying it failed.
      # This is expected as we have the wheels being downloaded to the same directory.
      # So each successive wheel will have the previous wheel in the directory and each
      # will be flagged as an extra file. See:
      # http://aka.ms/drop-validation-failure-additional-files
      - job: "Publish_Python_Packages"
        pool:
          name: 'Azure-Pipelines-DevTools-EO'
          image: 'ubuntu-latest'
          os: linux
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - ${{ each target in parameters.matrix }}:
            - input: pipelineArtifact
              artifactName: wheel.${{ target.os }}.${{ target.arch }}
              targetPath: $(System.DefaultWorkingDirectory)/target/wheels
        steps:
        - script: |
            ls $(System.DefaultWorkingDirectory)/target/wheels
          displayName: Display Py Artifacts in Publishing Dir

        - task: EsrpRelease@9
          displayName: Publish Py Packages
          inputs:
            connectedservicename: 'PME ESRP Azure Connection'
            usemanagedidentity: true
            keyvaultname: 'quantum-esrp-kv'
            signcertname: ESRPCert
            clientid: '832c049d-cd07-4c1c-bfa5-c07250d190cb'
            contenttype: PyPi
            domaintenantid: '975f013f-7f24-47e8-a7d3-abc4752bf346'
            folderlocation: '$(System.DefaultWorkingDirectory)/target/wheels'
            waitforreleasecompletion: true
            owners: 'billti@microsoft.com'
            approvers: 'billti@microsoft.com'
            mainpublisher: ESRPRELPACMAN
