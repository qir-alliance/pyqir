name: pyqir-publish-$(BuildId)

# This pipeline is used to build and publish the PyQIR package
# It uses a Microsoft ADO template for additional security checks.

# Run on merges to main to ensure that the latest code
# is always able to be published.
trigger:
  branches:
    include:
    - main

# Run the pipeline every day at 6:00 AM to ensure
# codeql and other governance checks are up-to-date.
schedules:
- cron: "0 5 * * *"
  displayName: 'Build for Component Governance'
  branches:
    include:
    - main
  always: true


variables:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN_VERSION: "1.93"
  PYTHON_VERSION: "3.11"
  LLVM_VERSION: 20
  # use this to invalidate the cache. Any time we update the OS
  # image, we should increment this to ensure that the cache is rebuilt.
  CACHE_COUNTER: 10

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

parameters:
- name: matrix
  type: object
  default:
  # Temporarily disabled while iterating on Python 3.15t support on Azure Linux
  # ARM64. Restore all commented targets before finalizing or merging this PR.
  # - name: linux_x86_64
  #   poolName: 'Azure-Pipelines-DevTools-EO'
  #   imageName: 'ubuntu-22.04'
  #   os: linux
  #   arch: x86_64
  - name: linux_aarch64
    poolName: 'Azure-Pipelines-DevTools-ARM64-EO'
    imageName: 'azurelinux-3.0-gen2-arm64'
    os: linux
    arch: aarch64
  # - name: mac_x86_64
  #   poolName: 'Azure Pipelines'
  #   imageName: 'macOS-15'
  #   os: macOS
  #   arch: x86_64
  # - name: mac_aarch64
  #   poolName: 'AcesShared'
  #   os: macOS
  #   arch: aarch64
  # - name: windows_x86_64
  #   poolName: 'Azure-Pipelines-DevTools-EO'
  #   imageName: 'windows-2022'
  #   os: windows
  #   arch: x86_64
  # - name: windows_aarch64
  #   poolName: 'Azure-Pipelines-DevTools-ARM64-EO'
  #   imageName: 'windows-2025-gen2-arm64'
  #   os: windows
  #   arch: aarch64

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      autobaseline:
        enableForGitHub: true
      sourceAnalysisPool:
        name: 'Azure-Pipelines-DevTools-EO'
        image: windows-2022
        os: windows
    stages:
    - stage: build
      displayName: Build
      jobs:
      - ${{ each target in parameters.matrix }}:
        - job: ${{ target.name }}
          pool:
            name: ${{ target.poolName }}
            image: ${{ target.imageName }}
            os: ${{ target.os }}
            ${{ if eq(target.arch, 'aarch64') }}:
              hostArchitecture: Arm64
            ${{ if eq(target.poolName, 'AcesShared') }}:
              demands:
              - ImageOverride -equals ACES_VM_SharedPool_Sequoia
          variables:
            arch: ${{ target.arch }}
            ${{ if eq(target.os, 'windows') }}:
                LLVM_DIRECTORY: $(Build.SourcesDirectory)\target\llvm
            ${{ else }}:
                LLVM_DIRECTORY: $(Build.SourcesDirectory)/target/llvm
          timeoutInMinutes: 300
          templateContext:
            outputs:
            - output: pipelineArtifact
              displayName: 'Upload Python Artifacts for ${{ target.os }} ${{ target.arch }}'
              condition: succeeded()
              targetPath: $(System.DefaultWorkingDirectory)/target/wheels
              artifactName: wheel.${{ target.os }}.${{ target.arch }}
          steps:
          - task: RustInstaller@1
            inputs:
              rustVersion: ms-prod-$(RUST_TOOLCHAIN_VERSION)
              ${{ if target.additionalRustTargets }}:
                additionalTargets: ${{ target.additionalRustTargets }}
              cratesIoFeedOverride: $(cratesIoFeedOverride)
              toolchainFeed: $(toolchainFeed)
            displayName: Install Rust toolchain

          - script: |
              rustc --version
              rustc --print target-list
            displayName: View rust target info
            condition: succeeded()

          - task: PipAuthenticate@1
            displayName: Pip Authenticate
            inputs:
              artifactFeeds: 'AzureQuantum/azure-quantum'

          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)
              ${{ if eq(target.arch, 'aarch64') }}:
                architecture: "arm64"
            condition: and(succeeded(), not(and(eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))))

          # UsePythonVersion@0 does not support aarch64, so we install Python manually
          # using tdnf on Azure Linux 3.0 aarch64
          # We also need alias python3 as python
          - script: |
              sudo tdnf install python3-3.12.9 python3-pip-24.2 -y
              sudo alternatives --install /usr/bin/python python /usr/bin/python3 1
            displayName: Install Python on Azure Linux 3.0 aarch64
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))

          # Build or restore LLVM
          - pwsh: New-Item -ItemType Directory -Path $(LLVM_DIRECTORY) -Force
            displayName: Ensure cache dir exists
            condition: succeeded()

          - task: Cache@2
            inputs:
              key: '"llvm-$(LLVM_VERSION)-${{ target.os }}-${{ target.arch }}-$(CACHE_COUNTER)"'
              restoreKeys: '"llvm-$(LLVM_VERSION)-${{ target.os }}-${{ target.arch }}-$(CACHE_COUNTER)"'
              path: $(LLVM_DIRECTORY)
              cacheHitVar: CACHE_RESTORED
            displayName: Cache LLVM
            condition: succeeded()

          - pwsh: |
              git config --global core.longpaths true

              $directory = Resolve-Path $(LLVM_DIRECTORY)

              # Tell the build where LLVM is installed
              # This is usually automatic, but we are using a different directory than the default
              Write-Host "##vso[task.setvariable variable=QIRLIB_LLVM_EXTERNAL_DIR;]$directory"

              # Tell the build what llvm feature version to use
              $feature = "llvm$(LLVM_VERSION)-1"
              $variableName = "LLVM_SYS_$(LLVM_VERSION)1_PREFIX"
              Write-Host "##vso[task.setvariable variable=PYQIR_LLVM_FEATURE_VERSION;]$feature"

              # Tell LLVM-SYS where LLVM is installed
              Write-Host "##vso[task.setvariable variable=$variableName;]$directory"

              # Tell the qirlib build where to cache the LLVM directory and to not download LLVM
              Write-Host "##vso[task.setvariable variable=QIRLIB_CACHE_DIR;]$directory"
              Write-Host "##vso[task.setvariable variable=QIRLIB_DOWNLOAD_LLVM;]false"
            displayName: Configure Environment
            condition: succeeded()

          # prerequisites for building
          - script: |
              sudo apt-get install -y ninja-build
            displayName: Install build dependencies
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'x86_64'), ne(variables.CACHE_RESTORED, 'true'))

          - script: |
              sudo tdnf install ninja-build cmake -y
            displayName: Install c++ build tools on Azure Linux 3.0 aarch64
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'), ne(variables.CACHE_RESTORED, 'true'))

          - script: |
              brew install cmake ninja ccache
            displayName: Install build dependencies
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Darwin'), ne(variables.CACHE_RESTORED, 'true'))

          # on Azure Linux 3.0 aarch64 we need to install:
          # ld with binutils
          # crt1.o and others with glibc-devel
          # std lib headers with kernel-headers
          # ninja and cmake for building LLVM
          - script: |
              sudo tdnf install binutils glibc-devel kernel-headers gcc -y
            displayName: Install c++ build tools on Azure Linux 3.0 aarch64
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))

          # build and install LLVM

          - pwsh: ./build.ps1 -t install-llvm-from-source
            displayName: Build and Install LLVM
            condition: and(succeeded(), not(canceled()), not(failed()), ne(variables.CACHE_RESTORED, 'true'))

          # Build PyQIR
          - pwsh: ./build.ps1
            displayName: Build
            condition: succeeded()

          # The pyqir task clears target/wheels, so preserve the ABI3 wheel
          # while building the ABI3T wheel with Python 3.15.
          - pwsh: |
              $abi3Wheels = Join-Path "$(Agent.TempDirectory)" "pyqir-abi3-wheels-$(System.JobId)"
              New-Item -ItemType Directory -Path $abi3Wheels -Force
              Copy-Item `
                -Path (Join-Path "$(System.DefaultWorkingDirectory)" "target/wheels/pyqir-*.whl") `
                -Destination $abi3Wheels
            displayName: Preserve ABI3 Wheel
            condition: succeeded()

          - task: UsePythonVersion@0
            inputs:
              versionSpec: ">=3.15.0-a0 <3.16.0"
              allowUnstable: true
              ${{ if eq(target.arch, 'aarch64') }}:
                architecture: "arm64"
            displayName: Set Up Python 3.15 for ABI3T
            condition: and(succeeded(), not(and(eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))))

          - script: |
              set -euo pipefail

              python_version="3.15.0rc2"
              python_sha256="8d93af5eaaaea5adfd41bd786a7ba3f03f2ad1ab57c6a65e0b963deab91d5ad7"
              work_dir="$(Agent.TempDirectory)/cpython-3.15t-$(System.JobId)"
              archive="$work_dir/Python-$python_version.tar.xz"
              source_dir="$work_dir/Python-$python_version"
              prefix="$work_dir/install"

              sudo tdnf install -y \
                curl \
                make \
                tar \
                xz \
                bzip2-devel \
                expat-devel \
                libffi-devel \
                ncurses-devel \
                openssl-devel \
                pkgconf-pkg-config \
                readline-devel \
                sqlite-devel \
                xz-devel \
                zlib-devel

              mkdir -p "$work_dir"
              curl --fail --location --silent --show-error \
                "https://www.python.org/ftp/python/3.15.0/Python-$python_version.tar.xz" \
                --output "$archive"
              echo "$python_sha256  $archive" | sha256sum --check -
              tar --extract --file "$archive" --directory "$work_dir"

              cd "$source_dir"
              ./configure --prefix="$prefix" --disable-gil --with-ensurepip=install
              jobs="$(nproc)"
              make -j"$jobs"
              make install

              python_bin="$prefix/bin/python3.15t"
              test -x "$python_bin"
              ln -sf "$python_bin" "$prefix/bin/python"
              ln -sf "$python_bin" "$prefix/bin/python3"

              "$python_bin" --version
              "$python_bin" -c 'import platform, sys, sysconfig; print("Executable:", sys.executable); print("Architecture:", platform.machine()); print("Py_GIL_DISABLED:", sysconfig.get_config_var("Py_GIL_DISABLED")); print("GIL enabled:", sys._is_gil_enabled()); assert platform.machine().lower() in {"aarch64", "arm64"}; assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1; assert not sys._is_gil_enabled()'

              echo "##vso[task.prependpath]$prefix/bin"
            displayName: Build Python 3.15t from source on Azure Linux ARM64
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))

          - pwsh: |
              $buildVenv = Join-Path "$(System.DefaultWorkingDirectory)" "target/.env"
              if (Test-Path $buildVenv) {
                Remove-Item -Path $buildVenv -Recurse -Force -ErrorAction Stop
              }

              python -c "import sys; print(f'Selected Python: {sys.executable} ({sys.version})')"

              if ("$(Agent.OS)" -eq "Linux" -and "$(arch)" -eq "aarch64") {
                python --version
                python -c 'import platform, sys, sysconfig; print("Selected executable:", sys.executable); print("Architecture:", platform.machine()); print("Py_GIL_DISABLED:", sysconfig.get_config_var("Py_GIL_DISABLED")); print("GIL enabled:", sys._is_gil_enabled()); assert platform.machine().lower() in {"aarch64", "arm64"}; assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1; assert not sys._is_gil_enabled()'
              }

              ./build.ps1 -t pyqir

              $venvPython = if ($IsWindows) {
                Join-Path $buildVenv "Scripts/python.exe"
              }
              else {
                Join-Path $buildVenv "bin/python"
              }
              & $venvPython -c "import sys; print(f'Build venv Python: {sys.executable} ({sys.version})')"

              if ("$(Agent.OS)" -eq "Linux" -and "$(arch)" -eq "aarch64") {
                & $venvPython --version
                & $venvPython -c 'import platform, sysconfig; print("Venv architecture:", platform.machine()); print("Venv Py_GIL_DISABLED:", sysconfig.get_config_var("Py_GIL_DISABLED")); assert platform.machine().lower() in {"aarch64", "arm64"}; assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1'
              }

              $wheelDirectory = Join-Path "$(System.DefaultWorkingDirectory)" "target/wheels"
              $abi3Wheels = Join-Path "$(Agent.TempDirectory)" "pyqir-abi3-wheels-$(System.JobId)"
              Copy-Item -Path (Join-Path $abi3Wheels "*.whl") -Destination $wheelDirectory

              if (-not (Test-Path (Join-Path $wheelDirectory "pyqir-*-cp39-abi3-*.whl"))) {
                throw "The ABI3 wheel was not preserved."
              }
              if (-not (Test-Path (Join-Path $wheelDirectory "pyqir-*-cp315-abi3.abi3t-*.whl"))) {
                throw "The ABI3T wheel was not generated."
              }
            displayName: Build ABI3T Wheel
            condition: succeeded()

          - script: |
              dir target\wheels\*
            displayName: List Py Packages on Win
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'))

          - script: |
              ls target/wheels/*
            displayName: List Py Packages on non-Win
            condition: and(succeeded(), ne(variables['Agent.OS'], 'Windows_NT'))

    - stage: approval
      displayName: Approval
      dependsOn: build
      condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
      jobs:
      - job: "Approval"
        pool: server
        timeoutInMinutes: 1440 # job times out in 1 day
        steps:
        - task: ManualValidation@0
          timeoutInMinutes: 1440 # task times out in 1 day
          inputs:
            notifyUsers: ''
            instructions: 'Please verify artifacts and approve the release'
            onTimeout: 'reject'

    - stage: release
      displayName: Release
      dependsOn: approval
      condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
      jobs:
      # We will get a warning about extra files in the sbom validation saying it failed.
      # This is expected as we have the wheels being downloaded to the same directory.
      # So each successive wheel will have the previous wheel in the directory and each
      # will be flagged as an extra file. See:
      # http://aka.ms/drop-validation-failure-additional-files
      - job: "Publish_Python_Packages"
        pool:
          name: 'Azure-Pipelines-DevTools-EO'
          image: 'ubuntu-latest'
          os: linux
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - ${{ each target in parameters.matrix }}:
            - input: pipelineArtifact
              artifactName: wheel.${{ target.os }}.${{ target.arch }}
              targetPath: $(System.DefaultWorkingDirectory)/target/wheels
        steps:
        - script: |
            ls $(System.DefaultWorkingDirectory)/target/wheels
          displayName: Display Py Artifacts in Publishing Dir

        - task: EsrpRelease@9
          condition: succeeded()
          displayName: Publish Py Packages
          inputs:
            connectedservicename: 'PME ESRP Azure Connection'
            usemanagedidentity: true
            keyvaultname: 'quantum-esrp-kv'
            signcertname: ESRPCert
            clientid: '832c049d-cd07-4c1c-bfa5-c07250d190cb'
            contenttype: PyPi
            domaintenantid: '975f013f-7f24-47e8-a7d3-abc4752bf346'
            folderlocation: '$(System.DefaultWorkingDirectory)/target/wheels'
            waitforreleasecompletion: true
            owners: 'billti@microsoft.com'
            approvers: 'billti@microsoft.com'
            mainpublisher: ESRPRELPACMAN
