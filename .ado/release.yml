name: pyqir-publish-$(BuildId)

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  containers:
    - container: qdkImage
      image: qdkacr-cfgqhwddajdaebhg.azurecr.io/qdk-image:latest
      endpoint: qdkacr

parameters:
- name: matrix
  type: object
  default:
  # - name: linux_x86_64
  #   poolName: 'Azure-Pipelines-DevTools-EO'
  #   imageName: 'ubuntu-22.04'
  #   os: linux
  #   arch: x86_64
  - name: linux_aarch64
    poolName: 'Azure-Pipelines-DevTools-ARM64-EO'
    imageName: 'azurelinux-3.0-gen2-arm64'
    os: linux
    arch: aarch64

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
      # To fetch the Universal Package from the ADO feed, Azure blob access is needed. Also need to install dnf packages
      # See https://eng.ms/docs/cloud-ai-platform/devdiv/one-engineering-system-1es/1es-build/cloudbuild/security/1espt-network-isolation
      networkIsolationPolicy: AzureStorage

    sdl:
      autobaseline:
        enableForGitHub: true
      sourceAnalysisPool:
        name: 'Azure-Pipelines-DevTools-EO'
        image: windows-2022
        os: windows
    stages:
    - stage: build
      displayName: Build
      jobs:
      - ${{ each target in parameters.matrix }}:
        - job: ${{ target.name }}
          pool:
            name: ${{ target.poolName }}
            image: ${{ target.imageName }}
            os: ${{ target.os }}
          # container: qdkImage
          variables:
            arch: ${{ target.arch }}
            ${{ if eq(target.os, 'windows') }}:
                LLVM_DIRECTORY: $(Build.SourcesDirectory)\target\llvm
            ${{ else }}:
                LLVM_DIRECTORY: $(Build.SourcesDirectory)/target/llvm
          timeoutInMinutes: 300
          templateContext:
            authenticatedContainerRegistries:
            - serviceConnection: qdkacr
            outputs:
            - output: containerImage
              image: qdk-llvm:$(Build.BuildNumber)
              remoteImage: qdkacr-cfgqhwddajdaebhg.azurecr.io/qdk-llvm:$(Build.BuildNumber)
            # - output: pipelineArtifact
            #   displayName: 'Upload Python Artifacts for ${{ target.os }} ${{ target.arch }}'
            #   condition: succeeded()
            #   targetPath: $(System.DefaultWorkingDirectory)/target/wheels
            #   artifactName: wheel.${{ target.os }}.${{ target.arch }}
          steps:
          - checkout: self

          - task: UniversalPackages@1
            displayName: Download LLVM source
            inputs:
              command: download
              feed: "AzureQuantum/azure-quantum"
              packageName: "llvm-source"
              packageVersion: "20.1.8" # or '*', '18.*' (wildcards supported for download)
              directory: "$(Pipeline.Workspace)/llvm-src"

          # Need to copy the LLVM source into the container before building it
          - script: |
              set -euxo pipefail
              cp -R "$(Pipeline.Workspace)/llvm-src/." "$(Build.SourcesDirectory)/.ado/images/qdk-llvm"
              ls -la "$(Build.SourcesDirectory)/.ado/images/qdk-llvm"
            displayName: Copy LLVM source into container build context

          - task: 1ES.BuildContainerImage@1
            inputs:
              path: $(Build.SourcesDirectory)/.ado/images/qdk-llvm
              image: qdk-llvm:$(Build.BuildNumber)

          # - script: |
          #     set -euxo pipefail
          #     cat /etc/redhat-release
          #     uname -m
          #     python --version
          #   target: qdkImage
          #   displayName: Verify Environment
          # - task: RustInstaller@1
          #   inputs:
          #     rustVersion: ms-prod-$(RUST_TOOLCHAIN_VERSION)
          #     ${{ if target.additionalRustTargets }}:
          #       additionalTargets: ${{ target.additionalRustTargets }}
          #     cratesIoFeedOverride: $(cratesIoFeedOverride)
          #     toolchainFeed: $(toolchainFeed)
          #   displayName: Install Rust toolchain

          # - script: |
          #     ls target/wheels/*
