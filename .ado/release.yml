name: pyqir-publish-$(BuildId)

# This pipeline is used to build and publish the PyQIR package
# It uses a Microsoft ADO template for additional security checks.

# Run on merges to main to ensure that the latest code
# is always able to be published.
trigger:
  branches:
    include:
    - main

# Run the pipeline every day at 6:00 AM to ensure
# codeql and other governance checks are up-to-date.
schedules:
- cron: "0 5 * * *"
  displayName: 'Build for Component Governance'
  branches:
    include:
    - main
  always: true


variables:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN_VERSION: "1.93"
  PYTHON_VERSION: "3.11"
  PYTHON_315_VERSION: "3.15.0rc3"
  PYTHON_315_DIRECTORY: $(Pipeline.Workspace)/python-3.15-arm64
  PYTHON_315_CACHE_COUNTER: 1
  PYTHON_315_PREBUILT_VERSION: "3.15.0-rc.3"
  PYTHON_315T_DIRECTORY: $(Pipeline.Workspace)/python-3.15t-arm64
  PYTHON_315T_CACHE_COUNTER: 1
  LLVM_VERSION: 20
  # use this to invalidate the cache. Any time we update the OS
  # image, we should increment this to ensure that the cache is rebuilt.
  CACHE_COUNTER: 10

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

parameters:
- name: matrix
  type: object
  default:
  - name: linux_x86_64
    poolName: 'Azure-Pipelines-DevTools-EO'
    imageName: 'ubuntu-22.04'
    os: linux
    arch: x86_64
    python315tAssetUrl: "https://github.com/actions/python-versions/releases/download/3.15.0-rc.3-37256039299/python-3.15.0-rc.3-linux-22.04-x64-freethreaded.tar.gz"
    python315tAssetSha256Variable: PYTHON_315T_LINUX_X64_SHA256
    python315tToolcacheArch: x64-freethreaded
  - name: linux_aarch64
    poolName: 'Azure-Pipelines-DevTools-ARM64-EO'
    imageName: 'azurelinux-3.0-gen2-arm64'
    os: linux
    arch: aarch64
  - name: mac_x86_64
    poolName: 'Azure Pipelines'
    imageName: 'macOS-15'
    os: macOS
    arch: x86_64
    python315tAssetUrl: "https://github.com/actions/python-versions/releases/download/3.15.0-rc.3-37256039299/python-3.15.0-rc.3-darwin-x64-freethreaded.tar.gz"
    python315tAssetSha256Variable: PYTHON_315T_MACOS_X64_SHA256
    python315tToolcacheArch: x64-freethreaded
  - name: mac_aarch64
    poolName: 'AcesShared'
    os: macOS
    arch: aarch64
    python315tAssetUrl: "https://github.com/actions/python-versions/releases/download/3.15.0-rc.3-37256039299/python-3.15.0-rc.3-darwin-arm64-freethreaded.tar.gz"
    python315tAssetSha256Variable: PYTHON_315T_MACOS_ARM64_SHA256
    python315tToolcacheArch: arm64-freethreaded
  - name: windows_x86_64
    poolName: 'Azure-Pipelines-DevTools-EO'
    imageName: 'windows-2022'
    os: windows
    arch: x86_64
    python315tAssetUrl: "https://github.com/actions/python-versions/releases/download/3.15.0-rc.3-37256039299/python-3.15.0-rc.3-win32-x64-freethreaded.zip"
    python315tAssetSha256Variable: PYTHON_315T_WINDOWS_X64_SHA256
    python315tToolcacheArch: x64-freethreaded
  - name: windows_aarch64
    poolName: 'Azure-Pipelines-DevTools-ARM64-EO'
    imageName: 'windows-2025-gen2-arm64'
    os: windows
    arch: aarch64
    python315tAssetUrl: "https://github.com/actions/python-versions/releases/download/3.15.0-rc.3-37256039299/python-3.15.0-rc.3-win32-arm64-freethreaded.zip"
    python315tAssetSha256Variable: PYTHON_315T_WINDOWS_ARM64_SHA256
    python315tToolcacheArch: arm64-freethreaded

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      autobaseline:
        enableForGitHub: true
      sourceAnalysisPool:
        name: 'Azure-Pipelines-DevTools-EO'
        image: windows-2022
        os: windows
    stages:
    - stage: build
      displayName: Build
      jobs:
      - ${{ each target in parameters.matrix }}:
        - job: ${{ target.name }}
          pool:
            name: ${{ target.poolName }}
            image: ${{ target.imageName }}
            os: ${{ target.os }}
            ${{ if eq(target.arch, 'aarch64') }}:
              hostArchitecture: Arm64
            ${{ if eq(target.poolName, 'AcesShared') }}:
              demands:
              - ImageOverride -equals ACES_VM_SharedPool_Sequoia
          variables:
            arch: ${{ target.arch }}
            ${{ if target.python315tAssetUrl }}:
              PYTHON_315T_ASSET_URL: ${{ target.python315tAssetUrl }}
              PYTHON_315T_ASSET_SHA256_VARIABLE: ${{ target.python315tAssetSha256Variable }}
              PYTHON_315T_TOOLCACHE_ARCH: ${{ target.python315tToolcacheArch }}
            ${{ if eq(target.os, 'windows') }}:
                LLVM_DIRECTORY: $(Build.SourcesDirectory)\target\llvm
            ${{ else }}:
                LLVM_DIRECTORY: $(Build.SourcesDirectory)/target/llvm
          timeoutInMinutes: 300
          templateContext:
            outputs:
            - output: pipelineArtifact
              displayName: 'Upload Python Artifacts for ${{ target.os }} ${{ target.arch }}'
              condition: succeeded()
              targetPath: $(System.DefaultWorkingDirectory)/target/wheels
              artifactName: wheel.${{ target.os }}.${{ target.arch }}
          steps:
          - task: RustInstaller@1
            inputs:
              rustVersion: ms-prod-$(RUST_TOOLCHAIN_VERSION)
              ${{ if target.additionalRustTargets }}:
                additionalTargets: ${{ target.additionalRustTargets }}
              cratesIoFeedOverride: $(cratesIoFeedOverride)
              toolchainFeed: $(toolchainFeed)
            displayName: Install Rust toolchain

          - script: |
              rustc --version
              rustc --print target-list
            displayName: View rust target info
            condition: succeeded()

          - task: PipAuthenticate@1
            displayName: Pip Authenticate
            inputs:
              artifactFeeds: 'AzureQuantum/azure-quantum'

          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)
              ${{ if eq(target.arch, 'aarch64') }}:
                architecture: "arm64"
            condition: and(succeeded(), not(and(eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))))

          # UsePythonVersion@0 does not support aarch64, so we install Python manually
          # using tdnf on Azure Linux 3.0 aarch64
          # We also need alias python3 as python
          - script: |
              sudo tdnf install python3-3.12.9 python3-pip-24.2 -y
              sudo alternatives --install /usr/bin/python python /usr/bin/python3 1
            displayName: Install Python on Azure Linux 3.0 aarch64
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))

          # Build or restore LLVM
          - pwsh: New-Item -ItemType Directory -Path $(LLVM_DIRECTORY) -Force
            displayName: Ensure cache dir exists
            condition: succeeded()

          - task: Cache@2
            inputs:
              key: '"llvm-$(LLVM_VERSION)-${{ target.os }}-${{ target.arch }}-$(CACHE_COUNTER)"'
              restoreKeys: '"llvm-$(LLVM_VERSION)-${{ target.os }}-${{ target.arch }}-$(CACHE_COUNTER)"'
              path: $(LLVM_DIRECTORY)
              cacheHitVar: CACHE_RESTORED
            displayName: Cache LLVM
            condition: succeeded()

          - pwsh: |
              git config --global core.longpaths true

              $directory = Resolve-Path $(LLVM_DIRECTORY)

              # Tell the build where LLVM is installed
              # This is usually automatic, but we are using a different directory than the default
              Write-Host "##vso[task.setvariable variable=QIRLIB_LLVM_EXTERNAL_DIR;]$directory"

              # Tell the build what llvm feature version to use
              $feature = "llvm$(LLVM_VERSION)-1"
              $variableName = "LLVM_SYS_$(LLVM_VERSION)1_PREFIX"
              Write-Host "##vso[task.setvariable variable=PYQIR_LLVM_FEATURE_VERSION;]$feature"

              # Tell LLVM-SYS where LLVM is installed
              Write-Host "##vso[task.setvariable variable=$variableName;]$directory"

              # Tell the qirlib build where to cache the LLVM directory and to not download LLVM
              Write-Host "##vso[task.setvariable variable=QIRLIB_CACHE_DIR;]$directory"
              Write-Host "##vso[task.setvariable variable=QIRLIB_DOWNLOAD_LLVM;]false"
            displayName: Configure Environment
            condition: succeeded()

          # prerequisites for building
          - script: |
              sudo apt-get install -y ninja-build
            displayName: Install build dependencies
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'x86_64'), ne(variables.CACHE_RESTORED, 'true'))

          - script: |
              sudo tdnf install ninja-build cmake -y
            displayName: Install c++ build tools on Azure Linux 3.0 aarch64
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'), ne(variables.CACHE_RESTORED, 'true'))

          - script: |
              brew install cmake ninja ccache
            displayName: Install build dependencies
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Darwin'), ne(variables.CACHE_RESTORED, 'true'))

          # on Azure Linux 3.0 aarch64 we need to install:
          # ld with binutils
          # crt1.o and others with glibc-devel
          # std lib headers with kernel-headers
          # ninja and cmake for building LLVM
          - script: |
              sudo tdnf install binutils glibc-devel kernel-headers gcc -y
            displayName: Install c++ build tools on Azure Linux 3.0 aarch64
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))

          # build and install LLVM

          - pwsh: ./build.ps1 -t install-llvm-from-source
            displayName: Build and Install LLVM
            condition: and(succeeded(), not(canceled()), not(failed()), ne(variables.CACHE_RESTORED, 'true'))

          # Build PyQIR
          - pwsh: ./build.ps1
            displayName: Build
            condition: succeeded()

          # The pyqir task clears target/wheels, so preserve the ABI3 wheel
          # while building the ABI3T wheel with Python 3.15.
          - pwsh: |
              $wheelDirectory = Join-Path "$(System.DefaultWorkingDirectory)" "target/wheels"
              $abi3WheelMatches = @(
                Get-ChildItem -Path $wheelDirectory -Filter "pyqir-*-cp39-abi3-*.whl" -File
              )
              if ($abi3WheelMatches.Count -ne 1) {
                $matchingNames = $abi3WheelMatches.Name -join ", "
                throw "Expected exactly one ABI3 wheel before the ABI3T build, found $($abi3WheelMatches.Count): $matchingNames"
              }

              $abi3Wheels = Join-Path "$(Agent.TempDirectory)" "pyqir-abi3-wheels-$(System.JobId)"
              if (Test-Path $abi3Wheels) {
                Remove-Item -Path $abi3Wheels -Recurse -Force -ErrorAction Stop
              }
              New-Item -ItemType Directory -Path $abi3Wheels -Force
              Copy-Item `
                -LiteralPath $abi3WheelMatches[0].FullName `
                -Destination $abi3Wheels
              Write-Host "Preserved ABI3 wheel: $($abi3WheelMatches[0].Name)"
            displayName: Preserve ABI3 Wheel
            condition: succeeded()

          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_315_PREBUILT_VERSION)
              allowUnstable: true
              ${{ if eq(target.arch, 'aarch64') }}:
                architecture: "arm64"
            displayName: Set Up Python 3.15 for ABI3T
            condition: and(succeeded(), not(and(eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))))

          - pwsh: |
              $commit = "$(PYTHON_315_COMMIT)"
              if ($commit -notmatch "^[a-fA-F0-9]{40}$") {
                throw "Define the non-secret ADO pipeline variable PYTHON_315_COMMIT with the pinned CPython commit."
              }
            displayName: Validate pinned CPython commit
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))

          - task: Cache@2
            inputs:
              key: '"python-$(PYTHON_315_VERSION)-$(PYTHON_315_COMMIT)-azurelinux-3.0-arm64-gil-enabled-$(PYTHON_315_CACHE_COUNTER)"'
              path: $(PYTHON_315_DIRECTORY)
              cacheHitVar: PYTHON_315_CACHE_RESTORED
            displayName: Cache Python 3.15 on Azure Linux ARM64
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))

          - script: |
              set -euo pipefail

              python_version="$(PYTHON_315_VERSION)"
              source_dir="$(Agent.TempDirectory)/cpython-$python_version-$(System.JobId)"
              prefix="$(PYTHON_315_DIRECTORY)"

              if [ "$(PYTHON_315_CACHE_RESTORED)" != "true" ]; then
                sudo tdnf install -y \
                  git \
                  make \
                  bzip2-devel \
                  expat-devel \
                  libffi-devel \
                  ncurses-devel \
                  openssl-devel \
                  pkgconf-pkg-config \
                  readline-devel \
                  sqlite-devel \
                  xz-devel \
                  zlib-devel

                git clone \
                  --branch "v$python_version" \
                  --depth 1 \
                  --single-branch \
                  https://github.com/python/cpython.git \
                  "$source_dir"

                actual_commit="$(git -C "$source_dir" rev-parse HEAD)"
                expected_commit="$(PYTHON_315_COMMIT)"
                echo "Expected CPython commit: $expected_commit"
                echo "Actual CPython commit:   $actual_commit"
                if [ "$actual_commit" != "$expected_commit" ]; then
                  echo "ERROR: CPython v$python_version resolved to an unexpected commit." >&2
                  exit 1
                fi

                cd "$source_dir"
                ./configure --prefix="$prefix" --with-ensurepip=install
                jobs="$(nproc)"
                make -j"$jobs"
                make install
              else
                echo "Using cached Python installation from $prefix"
              fi

              python_bin="$prefix/bin/python3.15"
              test -x "$python_bin"
              ln -sf "$python_bin" "$prefix/bin/python"
              ln -sf "$python_bin" "$prefix/bin/python3"

              "$python_bin" --version
              "$python_bin" -c 'import platform, sys; from pathlib import Path; actual_executable = Path(sys.executable).resolve(); expected_executable = Path(sys.argv[1]).resolve(); actual_prefix = Path(sys.prefix).resolve(); expected_prefix = Path(sys.argv[2]).resolve(); print("Executable:", actual_executable); print("Prefix:", actual_prefix); print("Architecture:", platform.machine()); assert sys.version_info[:2] == (3, 15); assert platform.machine().lower() in {"aarch64", "arm64"}; assert actual_executable == expected_executable; assert actual_prefix == expected_prefix' "$python_bin" "$prefix"

              echo "##vso[task.prependpath]$prefix/bin"
            displayName: Build Python 3.15 from source on Azure Linux ARM64
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))

          - pwsh: |
              $buildVenv = Join-Path "$(System.DefaultWorkingDirectory)" "target/.env"
              if (Test-Path $buildVenv) {
                Remove-Item -Path $buildVenv -Recurse -Force -ErrorAction Stop
              }

              python -c 'import sys; print(f"Selected Python: {sys.executable} ({sys.version})"); print("GIL enabled:", sys._is_gil_enabled()); assert sys.version_info[:2] == (3, 15); assert sys._is_gil_enabled()'
              if ($LASTEXITCODE -ne 0) {
                throw "Regular Python 3.15 validation failed."
              }
              $selectedPythonVersion = (python -c 'import platform; print(platform.python_version())').Trim()
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($selectedPythonVersion)) {
                throw "Failed to determine the selected regular Python 3.15 version."
              }
              Write-Host "Selected regular Python version: $selectedPythonVersion"
              Write-Host "##vso[task.setvariable variable=PYTHON_315_SELECTED_VERSION]$selectedPythonVersion"

              if ("$(Agent.OS)" -eq "Linux" -and "$(arch)" -eq "aarch64") {
                $expectedPython = Join-Path "$(PYTHON_315_DIRECTORY)" "bin/python3.15"
                python --version
                python -c 'import platform, sys; from pathlib import Path; actual_executable = Path(sys.executable).resolve(); expected_executable = Path(sys.argv[1]).resolve(); actual_prefix = Path(sys.prefix).resolve(); expected_prefix = Path(sys.argv[2]).resolve(); print("Selected executable:", actual_executable); print("Selected prefix:", actual_prefix); print("Architecture:", platform.machine()); assert sys.version_info[:2] == (3, 15); assert platform.machine().lower() in {"aarch64", "arm64"}; assert actual_executable == expected_executable; assert actual_prefix == expected_prefix; assert sys._is_gil_enabled()' $expectedPython "$(PYTHON_315_DIRECTORY)"
              }

              ./build.ps1 -t pyqir

              $venvPython = if ($IsWindows) {
                Join-Path $buildVenv "Scripts/python.exe"
              }
              else {
                Join-Path $buildVenv "bin/python"
              }
              & $venvPython -c "import sys; print(f'Build venv Python: {sys.executable} ({sys.version})')"

              if ("$(Agent.OS)" -eq "Linux" -and "$(arch)" -eq "aarch64") {
                & $venvPython --version
                & $venvPython -c 'import platform, sys; from pathlib import Path; actual_base_prefix = Path(sys.base_prefix).resolve(); expected_base_prefix = Path(sys.argv[1]).resolve(); print("Venv base prefix:", actual_base_prefix); print("Venv architecture:", platform.machine()); assert sys.version_info[:2] == (3, 15); assert platform.machine().lower() in {"aarch64", "arm64"}; assert actual_base_prefix == expected_base_prefix' "$(PYTHON_315_DIRECTORY)"
              }

              $wheelDirectory = Join-Path "$(System.DefaultWorkingDirectory)" "target/wheels"
              $abi3tWheelMatches = @(
                Get-ChildItem -Path $wheelDirectory -Filter "pyqir-*-cp315-abi3.abi3t-*.whl" -File
              )
              if ($abi3tWheelMatches.Count -ne 1) {
                $matchingNames = $abi3tWheelMatches.Name -join ", "
                throw "Expected exactly one ABI3T wheel after the ABI3T build, found $($abi3tWheelMatches.Count): $matchingNames"
              }

              $env:PYQIR_TEST_WHEEL = $abi3tWheelMatches[0].FullName
              try {
                Write-Host "Testing ABI3T wheel with regular Python 3.15: $($abi3tWheelMatches[0].Name)"
                ./build.ps1 -t test
                if ($LASTEXITCODE -ne 0) {
                  throw "ABI3T wheel tests failed under regular Python 3.15."
                }
              }
              finally {
                Remove-Item Env:\PYQIR_TEST_WHEEL -ErrorAction SilentlyContinue
              }

              $abi3Wheels = Join-Path "$(Agent.TempDirectory)" "pyqir-abi3-wheels-$(System.JobId)"
              $preservedAbi3WheelMatches = @(
                Get-ChildItem -Path $abi3Wheels -Filter "pyqir-*-cp39-abi3-*.whl" -File
              )
              if ($preservedAbi3WheelMatches.Count -ne 1) {
                $matchingNames = $preservedAbi3WheelMatches.Name -join ", "
                throw "Expected exactly one preserved ABI3 wheel, found $($preservedAbi3WheelMatches.Count): $matchingNames"
              }
              Copy-Item -LiteralPath $preservedAbi3WheelMatches[0].FullName -Destination $wheelDirectory

              $pyqirWheels = @(Get-ChildItem -Path $wheelDirectory -Filter "pyqir-*.whl" -File)
              $abi3WheelMatches = @(
                $pyqirWheels | Where-Object Name -Like "pyqir-*-cp39-abi3-*.whl"
              )
              $abi3tWheelMatches = @(
                $pyqirWheels | Where-Object Name -Like "pyqir-*-cp315-abi3.abi3t-*.whl"
              )
              $unexpectedWheelMatches = @(
                $pyqirWheels | Where-Object {
                  $_.Name -NotLike "pyqir-*-cp39-abi3-*.whl" -and
                  $_.Name -NotLike "pyqir-*-cp315-abi3.abi3t-*.whl"
                }
              )

              if ($abi3WheelMatches.Count -ne 1) {
                $matchingNames = $abi3WheelMatches.Name -join ", "
                throw "Expected exactly one final ABI3 wheel, found $($abi3WheelMatches.Count): $matchingNames"
              }
              if ($abi3tWheelMatches.Count -ne 1) {
                $matchingNames = $abi3tWheelMatches.Name -join ", "
                throw "Expected exactly one final ABI3T wheel, found $($abi3tWheelMatches.Count): $matchingNames"
              }
              if ($unexpectedWheelMatches.Count -ne 0) {
                $unexpectedNames = $unexpectedWheelMatches.Name -join ", "
                throw "Found unexpected PyQIR wheels: $unexpectedNames"
              }
              if ($pyqirWheels.Count -ne 2) {
                $wheelNames = $pyqirWheels.Name -join ", "
                throw "Expected exactly two final PyQIR wheels, found $($pyqirWheels.Count): $wheelNames"
              }

              Write-Host "Final PyQIR wheels:"
              $pyqirWheels | ForEach-Object { Write-Host "  $($_.Name)" }
            displayName: Build ABI3T Wheel
            condition: succeeded()

          - pwsh: |
              $assetUrl = $env:PYTHON_315T_ASSET_URL
              $expectedSha256Variable = $env:PYTHON_315T_ASSET_SHA256_VARIABLE
              $toolcacheArchitecture = $env:PYTHON_315T_TOOLCACHE_ARCH
              if ([string]::IsNullOrWhiteSpace($assetUrl) -or
                  [string]::IsNullOrWhiteSpace($expectedSha256Variable) -or
                  [string]::IsNullOrWhiteSpace($toolcacheArchitecture)) {
                throw "Missing pinned Python 3.15t asset metadata for this target."
              }

              $expectedSha256 = [Environment]::GetEnvironmentVariable($expectedSha256Variable)
              if ($expectedSha256 -notmatch "^[a-fA-F0-9]{64}$") {
                throw "Define the non-secret ADO pipeline variable $expectedSha256Variable with the published SHA-256 for this Python 3.15t asset."
              }

              $assetName = [System.IO.Path]::GetFileName(([Uri]$assetUrl).AbsolutePath)
              $downloadDirectory = Join-Path "$(Agent.TempDirectory)" "python-3.15t-download-$(System.JobId)"
              $extractDirectory = Join-Path "$(Agent.TempDirectory)" "python-3.15t-extract-$(System.JobId)"
              foreach ($directory in @($downloadDirectory, $extractDirectory)) {
                if (Test-Path $directory) {
                  Remove-Item -Path $directory -Recurse -Force -ErrorAction Stop
                }
                New-Item -ItemType Directory -Path $directory -Force | Out-Null
              }
              $assetPath = Join-Path $downloadDirectory $assetName

              Write-Host "Downloading pinned Python 3.15t asset: $assetUrl"
              Invoke-WebRequest -Uri $assetUrl -OutFile $assetPath
              $actualSha256 = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualSha256 -ne $expectedSha256.ToLowerInvariant()) {
                throw "SHA-256 mismatch for ${assetName}: expected $expectedSha256, got $actualSha256."
              }
              Write-Host "Verified SHA-256 for ${assetName}: $actualSha256"

              if ($assetName.EndsWith(".zip", [StringComparison]::OrdinalIgnoreCase)) {
                Expand-Archive -LiteralPath $assetPath -DestinationPath $extractDirectory -Force
                $setupScriptName = "setup.ps1"
              }
              elseif ($assetName.EndsWith(".tar.gz", [StringComparison]::OrdinalIgnoreCase)) {
                & tar -xzf $assetPath -C $extractDirectory
                if ($LASTEXITCODE -ne 0) {
                  throw "Failed to extract $assetName."
                }
                $setupScriptName = "setup.sh"
              }
              else {
                throw "Unsupported Python 3.15t asset format: $assetName"
              }

              $setupScriptMatches = @(
                Get-ChildItem -Path $extractDirectory -Filter $setupScriptName -File -Recurse
              )
              if ($setupScriptMatches.Count -ne 1) {
                $matchingNames = $setupScriptMatches.FullName -join ", "
                throw "Expected exactly one $setupScriptName in $assetName, found $($setupScriptMatches.Count): $matchingNames"
              }

              $toolDirectory = "$(Agent.ToolsDirectory)"
              if ([string]::IsNullOrWhiteSpace($toolDirectory)) {
                throw "Agent.ToolsDirectory is required to install the Python 3.15t distribution."
              }
              $env:AGENT_TOOLSDIRECTORY = $toolDirectory

              Push-Location $setupScriptMatches[0].DirectoryName
              try {
                if ("$(Agent.OS)" -eq "Windows_NT") {
                  & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $setupScriptMatches[0].FullName
                }
                else {
                  & bash $setupScriptMatches[0].FullName
                }
                if ($LASTEXITCODE -ne 0) {
                  throw "Python 3.15t setup failed with exit code $LASTEXITCODE."
                }
              }
              finally {
                Pop-Location
              }

              $installDirectory = Join-Path $toolDirectory "Python/$(PYTHON_315_PREBUILT_VERSION)/$toolcacheArchitecture"
              $pythonExecutable = if ("$(Agent.OS)" -eq "Windows_NT") {
                Join-Path $installDirectory "python.exe"
              }
              else {
                Join-Path $installDirectory "bin/python"
              }
              if (!(Test-Path -LiteralPath $pythonExecutable -PathType Leaf)) {
                throw "Python 3.15t executable not found at $pythonExecutable."
              }

              if ("$(Agent.OS)" -eq "Linux") {
                $pythonLibraryDirectory = Join-Path $installDirectory "lib"
                $libraryPath = if ([string]::IsNullOrWhiteSpace($env:LD_LIBRARY_PATH)) {
                  $pythonLibraryDirectory
                }
                else {
                  "$pythonLibraryDirectory`:$env:LD_LIBRARY_PATH"
                }
                Write-Host "##vso[task.setvariable variable=LD_LIBRARY_PATH]$libraryPath"
              }

              Write-Host "Python 3.15t executable: $pythonExecutable"
              Write-Host "##vso[task.setvariable variable=PYTHON_315T_EXECUTABLE]$pythonExecutable"
            displayName: Install pinned Python 3.15t distribution
            condition: and(succeeded(), not(and(eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))))

          - task: Cache@2
            inputs:
              key: '"python-$(PYTHON_315_VERSION)-$(PYTHON_315_COMMIT)-azurelinux-3.0-arm64-gil-disabled-$(PYTHON_315T_CACHE_COUNTER)"'
              path: $(PYTHON_315T_DIRECTORY)
              cacheHitVar: PYTHON_315T_CACHE_RESTORED
            displayName: Cache Python 3.15t on Azure Linux ARM64
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))

          - script: |
              set -euo pipefail

              python_version="$(PYTHON_315_VERSION)"
              source_dir="$(Agent.TempDirectory)/cpython-$python_version-freethreaded-$(System.JobId)"
              prefix="$(PYTHON_315T_DIRECTORY)"

              if [ "$(PYTHON_315T_CACHE_RESTORED)" != "true" ]; then
                sudo tdnf install -y \
                  git \
                  make \
                  bzip2-devel \
                  expat-devel \
                  libffi-devel \
                  ncurses-devel \
                  openssl-devel \
                  pkgconf-pkg-config \
                  readline-devel \
                  sqlite-devel \
                  xz-devel \
                  zlib-devel

                git clone \
                  --branch "v$python_version" \
                  --depth 1 \
                  --single-branch \
                  https://github.com/python/cpython.git \
                  "$source_dir"

                actual_commit="$(git -C "$source_dir" rev-parse HEAD)"
                expected_commit="$(PYTHON_315_COMMIT)"
                echo "Expected CPython commit: $expected_commit"
                echo "Actual CPython commit:   $actual_commit"
                if [ "$actual_commit" != "$expected_commit" ]; then
                  echo "ERROR: CPython v$python_version resolved to an unexpected commit." >&2
                  exit 1
                fi

                cd "$source_dir"
                ./configure \
                  --prefix="$prefix" \
                  --with-ensurepip=install \
                  --disable-gil
                jobs="$(nproc)"
                make -j"$jobs"
                make install
              else
                echo "Using cached free-threaded Python installation from $prefix"
              fi

              python_bin="$prefix/bin/python3.15t"
              test -x "$python_bin"
              ln -sf "$python_bin" "$prefix/bin/python"
              ln -sf "$python_bin" "$prefix/bin/python3"
              "$python_bin" --version
              echo "##vso[task.setvariable variable=PYTHON_315T_EXECUTABLE]$python_bin"
            displayName: Build Python 3.15t from source on Azure Linux ARM64
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))

          - pwsh: |
              $pythonExecutable = "$(PYTHON_315T_EXECUTABLE)"
              $regularPythonVersion = "$(PYTHON_315_SELECTED_VERSION)"
              if ([string]::IsNullOrWhiteSpace($pythonExecutable) -or
                  !(Test-Path -LiteralPath $pythonExecutable -PathType Leaf)) {
                throw "Python 3.15t executable not found at $pythonExecutable."
              }
              if ([string]::IsNullOrWhiteSpace($regularPythonVersion)) {
                throw "The regular Python 3.15 version was not recorded."
              }

              Write-Host "Validating Python 3.15t interpreter: $pythonExecutable"
              & $pythonExecutable -VV
              if ($LASTEXITCODE -ne 0) {
                throw "Python 3.15t version check failed."
              }
              & $pythonExecutable -c 'import platform, sys, sysconfig; expected_arch = sys.argv[1].lower(); expected_version = sys.argv[2]; actual_arch = platform.machine().lower(); actual_version = platform.python_version(); allowed_arches = {"x86_64": {"x86_64", "amd64"}, "aarch64": {"aarch64", "arm64"}}; print("Executable:", sys.executable); print("Version:", sys.version); print("Architecture:", actual_arch); print("ABI flags:", getattr(sys, "abiflags", "")); print("Py_GIL_DISABLED:", sysconfig.get_config_var("Py_GIL_DISABLED")); print("GIL enabled:", sys._is_gil_enabled()); print("Regular Python version:", expected_version); assert sys.version_info[:2] == (3, 15); assert actual_version == expected_version; assert actual_arch in allowed_arches[expected_arch]; assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1; assert not sys._is_gil_enabled()' "$(arch)" $regularPythonVersion
              if ($LASTEXITCODE -ne 0) {
                throw "Python 3.15t runtime verification failed."
              }

              $wheelDirectory = Join-Path "$(System.DefaultWorkingDirectory)" "target/wheels"
              $pyqirWheelsBefore = @(
                Get-ChildItem -Path $wheelDirectory -Filter "pyqir-*.whl" -File | Sort-Object Name
              )
              $abi3tWheelMatches = @(
                $pyqirWheelsBefore | Where-Object Name -Like "pyqir-*-cp315-abi3.abi3t-*.whl"
              )
              if ($pyqirWheelsBefore.Count -ne 2 -or $abi3tWheelMatches.Count -ne 1) {
                $wheelNames = $pyqirWheelsBefore.Name -join ", "
                throw "Expected two PyQIR wheels with exactly one ABI3T test candidate, found: $wheelNames"
              }

              $pythonDirectory = Split-Path -Parent $pythonExecutable
              $runtimePaths = @($pythonDirectory)
              if ("$(Agent.OS)" -eq "Windows_NT") {
                $runtimePaths = @((Join-Path $pythonDirectory "Scripts")) + $runtimePaths
              }
              $env:PATH = ($runtimePaths + @($env:PATH)) -join [System.IO.Path]::PathSeparator

              $env:PYQIR_TEST_WHEEL = $abi3tWheelMatches[0].FullName
              $env:PYQIR_TEST_GIL_DISABLED = "true"
              try {
                Write-Host "Testing ABI3T wheel with Python 3.15t: $($abi3tWheelMatches[0].Name)"
                ./build.ps1 -t test
                if ($LASTEXITCODE -ne 0) {
                  throw "PyQIR tests failed under Python 3.15t."
                }
              }
              finally {
                Remove-Item Env:\PYQIR_TEST_WHEEL -ErrorAction SilentlyContinue
                Remove-Item Env:\PYQIR_TEST_GIL_DISABLED -ErrorAction SilentlyContinue
              }

              $pyqirWheelsAfter = @(
                Get-ChildItem -Path $wheelDirectory -Filter "pyqir-*.whl" -File | Sort-Object Name
              )
              $wheelChanges = @(
                Compare-Object -ReferenceObject $pyqirWheelsBefore.Name -DifferenceObject $pyqirWheelsAfter.Name
              )
              if ($pyqirWheelsAfter.Count -ne 2 -or $wheelChanges.Count -ne 0) {
                $wheelNames = $pyqirWheelsAfter.Name -join ", "
                throw "Python 3.15t validation changed the two-wheel release output: $wheelNames"
              }
            displayName: Test ABI3T wheel with Python 3.15t
            condition: succeeded()

          - script: |
              dir target\wheels\*
            displayName: List Py Packages on Win
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'))

          - script: |
              ls target/wheels/*
            displayName: List Py Packages on non-Win
            condition: and(succeeded(), ne(variables['Agent.OS'], 'Windows_NT'))

    - stage: approval
      displayName: Approval
      dependsOn: build
      condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
      jobs:
      - job: "Approval"
        pool: server
        timeoutInMinutes: 1440 # job times out in 1 day
        steps:
        - task: ManualValidation@0
          timeoutInMinutes: 1440 # task times out in 1 day
          inputs:
            notifyUsers: ''
            instructions: 'Please verify artifacts and approve the release'
            onTimeout: 'reject'

    - stage: release
      displayName: Release
      dependsOn: approval
      condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
      jobs:
      # We will get a warning about extra files in the sbom validation saying it failed.
      # This is expected as we have the wheels being downloaded to the same directory.
      # So each successive wheel will have the previous wheel in the directory and each
      # will be flagged as an extra file. See:
      # http://aka.ms/drop-validation-failure-additional-files
      - job: "Publish_Python_Packages"
        pool:
          name: 'Azure-Pipelines-DevTools-EO'
          image: 'ubuntu-latest'
          os: linux
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - ${{ each target in parameters.matrix }}:
            - input: pipelineArtifact
              artifactName: wheel.${{ target.os }}.${{ target.arch }}
              targetPath: $(System.DefaultWorkingDirectory)/target/wheels
        steps:
        - script: |
            ls $(System.DefaultWorkingDirectory)/target/wheels
          displayName: Display Py Artifacts in Publishing Dir

        - task: EsrpRelease@9
          condition: succeeded()
          displayName: Publish Py Packages
          inputs:
            connectedservicename: 'PME ESRP Azure Connection'
            usemanagedidentity: true
            keyvaultname: 'quantum-esrp-kv'
            signcertname: ESRPCert
            clientid: '832c049d-cd07-4c1c-bfa5-c07250d190cb'
            contenttype: PyPi
            domaintenantid: '975f013f-7f24-47e8-a7d3-abc4752bf346'
            folderlocation: '$(System.DefaultWorkingDirectory)/target/wheels'
            waitforreleasecompletion: true
            owners: 'billti@microsoft.com'
            approvers: 'billti@microsoft.com'
            mainpublisher: ESRPRELPACMAN
