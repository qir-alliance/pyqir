name: pyqir-macos-test-$(BuildId)

# Scratch validation only: build and test both Macs without releasing packages.
trigger: none
pr: none

variables:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN_VERSION: "1.93"
  PYTHON_VERSION: "3.11"
  PYTHON_FREETHREADED_VERSION: "3.15.2"
  LLVM_VERSION: 20
  # use this to invalidate the cache. Any time we update the OS
  # image, we should increment this to ensure that the cache is rebuilt.
  CACHE_COUNTER: 10

parameters:
- name: matrix
  type: object
  default:
  - name: mac_x86_64
    poolName: 'Azure Pipelines'
    imageName: 'macOS-15'
    os: macOS
    arch: x86_64
  - name: mac_aarch64
    poolName: 'AcesShared'
    os: macOS
    arch: aarch64

# Parameters for building PyQIR
- name: ACR_SERVER
  displayName: Azure Container Registry server
  type: string
  default: 'qdkacr-cfgqhwddajdaebhg.azurecr.io'
- name: qdkBuildTag
  displayName: Tag for the qdk-build container image
  type: string
  default: 'latest'

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  containers:
    - container: qdkBuild
      image: ${{ parameters.ACR_SERVER }}/qdk-build:${{ parameters.qdkBuildTag }}
      endpoint: qdkacr

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      autobaseline:
        enableForGitHub: true
      sourceAnalysisPool:
        name: 'Azure-Pipelines-DevTools-EO'
        image: windows-2022
        os: windows
    stages:
    - stage: build
      displayName: Build
      jobs:
      - ${{ each target in parameters.matrix }}:
        - job: ${{ target.name }}
          pool:
            name: ${{ target.poolName }}
            image: ${{ target.imageName }}
            os: ${{ target.os }}
            ${{ if eq(target.arch, 'aarch64') }}:
              hostArchitecture: Arm64
            ${{ if eq(target.poolName, 'AcesShared') }}:
              demands:
              - ImageOverride -equals ACES_VM_SharedPool_Sequoia
          variables:
            arch: ${{ target.arch }}
            ${{ if eq(target.os, 'windows') }}:
                LLVM_DIRECTORY: $(Build.SourcesDirectory)\target\llvm
                ${{ if eq(target.arch, 'aarch64') }}:
                  PYTHON315T_NUGET_PACKAGE: pythonarm64-freethreaded
                ${{ else }}:
                  PYTHON315T_NUGET_PACKAGE: python-freethreaded
            ${{ else }}:
                LLVM_DIRECTORY: $(Build.SourcesDirectory)/target/llvm
          timeoutInMinutes: 300
          templateContext:
            ${{ if eq(target.os, 'linux') }}:
              authenticatedContainerRegistries:
              - serviceConnection: qdkacr
            outputs:
            - output: pipelineArtifact
              displayName: 'Upload Python Artifacts for ${{ target.os }} ${{ target.arch }}'
              condition: succeeded()
              targetPath: $(System.DefaultWorkingDirectory)/target/wheels
              artifactName: wheel.${{ target.os }}.${{ target.arch }}
          steps:
          - task: PipAuthenticate@1
            displayName: Pip Authenticate
            inputs:
              artifactFeeds: 'AzureQuantum/azure-quantum'

          # Build PyQIR in the Linux containers. Do this before the steps that install Python, Rust, etc.
          # on the host agent, as these can get added to the PATH in the container and mess with the build
          # if it finds the wrong tool versions.
          - ${{ if eq(target.os, 'linux') }}:
            - script: |
                set -euxo pipefail

                python3 -m venv .venv
                source .venv/bin/activate
                python -m pip install build "maturin~=1.15.0"

                mkdir -p .cargo/
                export CARGO_HOME=$(pwd)/.cargo
                cat > ".cargo/config.toml" <<EOF
                [source.crates-io]
                replace-with = "ms-crates-io"

                [source.ms-crates-io]
                registry = "$(cratesIoFeedOverride)"
                EOF

                cd qirlib
                export QIRLIB_CACHE_DIR=$LLVM_SYS_201_PREFIX
                cargo test  --release --features llvm20-1
                cargo build --release --features llvm20-1
                cd ..

                # See https://www.maturin.rs/bindings#py_limited_apiabi3
                maturin build \
                    --manifest-path pyqir/Cargo.toml \
                    --release \
                    --features llvm20-1 \
                    --compatibility manylinux_2_28 \
                    --interpreter python3.11

                maturin build \
                    --manifest-path pyqir/Cargo.toml \
                    --release \
                    --features llvm20-1 \
                    --compatibility manylinux_2_28 \
                    --interpreter python3.15t
              displayName: Build PyQIR in Linux containers
              target: qdkBuild
              env:
                PIP_INDEX_URL: $(PIP_INDEX_URL)
                # See https://eng.ms/docs/coreai/devdiv/one-engineering-system-1es/1es-docs/azure-artifacts/cargo
                CARGO_REGISTRIES_MS_CRATES_IO_INDEX: $(cratesIoFeedOverride)
                CARGO_REGISTRIES_MS_CRATES_IO_TOKEN: Bearer $(System.AccessToken)
                CARGO_REGISTRIES_MS_CRATES_IO_CREDENTIAL_PROVIDER: cargo:token

          # We don't need Rust if the build happened in the Linux container
          - ${{ if ne(target.os, 'linux') }}:
            - task: RustInstaller@1
              inputs:
                rustVersion: ms-prod-$(RUST_TOOLCHAIN_VERSION)
                ${{ if target.additionalRustTargets }}:
                  additionalTargets: ${{ target.additionalRustTargets }}
                cratesIoFeedOverride: $(cratesIoFeedOverride)
                toolchainFeed: $(toolchainFeed)
              displayName: Install Rust toolchain

            - script: |
                rustc --version
                rustc --print target-list
              displayName: View rust target info

          # We need Python on the host VM regardless of the container build to run tests and examples
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)
              ${{ if eq(target.arch, 'aarch64') }}:
                architecture: "arm64"
            condition: and(succeeded(), not(and(eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))))

          # UsePythonVersion@0 does not support aarch64, so we install Python manually
          # using tdnf on Azure Linux 3.0 aarch64
          # We also need alias python3 as python
          - script: |
              sudo tdnf install python3-3.12.9 python3-pip-24.2 -y
              sudo alternatives --install /usr/bin/python python /usr/bin/python3 1
            displayName: Install Python on Azure Linux 3.0 aarch64
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'aarch64'))

          # Build or restore LLVM - not needed for Linux builds where it is already in the container
          - ${{ if ne(target.os, 'linux') }}:
            - pwsh: New-Item -ItemType Directory -Path $(LLVM_DIRECTORY) -Force
              displayName: Ensure cache dir exists

            - task: Cache@2
              inputs:
                key: '"llvm-$(LLVM_VERSION)-${{ target.os }}-${{ target.arch }}-$(CACHE_COUNTER)"'
                restoreKeys: '"llvm-$(LLVM_VERSION)-${{ target.os }}-${{ target.arch }}-$(CACHE_COUNTER)"'
                path: $(LLVM_DIRECTORY)
                cacheHitVar: CACHE_RESTORED
              displayName: Cache LLVM

            - pwsh: |
                git config --global core.longpaths true

                $directory = Resolve-Path $(LLVM_DIRECTORY)

                # Tell the build where LLVM is installed
                # This is usually automatic, but we are using a different directory than the default
                Write-Host "##vso[task.setvariable variable=QIRLIB_LLVM_EXTERNAL_DIR;]$directory"

                # Tell the build what llvm feature version to use
                $feature = "llvm$(LLVM_VERSION)-1"
                $variableName = "LLVM_SYS_$(LLVM_VERSION)1_PREFIX"
                Write-Host "##vso[task.setvariable variable=PYQIR_LLVM_FEATURE_VERSION;]$feature"

                # Tell LLVM-SYS where LLVM is installed
                Write-Host "##vso[task.setvariable variable=$variableName;]$directory"

                # Tell the qirlib build where to cache the LLVM directory and to not download LLVM
                Write-Host "##vso[task.setvariable variable=QIRLIB_CACHE_DIR;]$directory"
                Write-Host "##vso[task.setvariable variable=QIRLIB_DOWNLOAD_LLVM;]false"
              displayName: Configure Environment

            - script: |
                brew install cmake ninja ccache
              displayName: Install build dependencies
              condition: and(succeeded(), eq(variables['Agent.OS'], 'Darwin'), ne(variables.CACHE_RESTORED, 'true'))

            # build and install LLVM
            - pwsh: ./build.ps1 -t install-llvm-from-source
              displayName: Build and Install LLVM
              condition: and(succeeded(), ne(variables.CACHE_RESTORED, 'true'))

            # Build PyQIR on Mac and Windows
            - pwsh: ./build.ps1
              displayName: Build

            # On Windows, UsePythonVersion@0 runs the python.org installer, which downloads freethreaded.msi and is
            # blocked by network isolation. Take the same interpreter from its NuGet package through the CFS feed
            # instead; -Source pins that feed so nuget.exe cannot fall back to nuget.org.
            # More information on using Python from NuGet packages on Windows:
            # https://docs.python.org/3/using/windows.html#the-nuget-org-packages
            - ${{ if eq(target.os, 'windows') }}:
              - task: NuGetCommand@2
                displayName: Download Python 3.15 free-threaded
                inputs:
                  command: custom
                  arguments: >-
                    install $(PYTHON315T_NUGET_PACKAGE)
                    -Version $(PYTHON_FREETHREADED_VERSION)
                    -ExcludeVersion
                    -OutputDirectory $(Agent.TempDirectory)\python315t
                    -Source $(pythonNugetFeed)

              - pwsh: |
                  $tools = (Resolve-Path (Join-Path "$(Agent.TempDirectory)" "python315t\$(PYTHON315T_NUGET_PACKAGE)\tools")).Path
                  Write-Host "##vso[task.setvariable variable=pythonLocation;isOutput=true]$tools"
                name: Python315t
                displayName: Locate Python 3.15 free-threaded

            - ${{ else }}:
              # UsePythonVersion@0 rejects free-threaded architectures:
              # https://github.com/microsoft/azure-pipelines-tasks/pull/22752
              - pwsh: |
                  $ErrorActionPreference = "Stop"
                  $version = "$(PYTHON_FREETHREADED_VERSION)"
                  $arch = if ("${{ target.arch }}" -eq "aarch64") { "arm64-freethreaded" } else { "x64-freethreaded" }
                  $manifest = Invoke-RestMethod "https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json"
                  $files = @(
                    ($manifest | Where-Object version -eq $version).files |
                      Where-Object { $_.platform -eq "darwin" -and $_.arch -eq $arch }
                  )
                  if ($files.Count -ne 1) {
                    throw "Expected one Python $version ($arch) macOS package, found $($files.Count)."
                  }

                  $installer = Join-Path "$(Agent.TempDirectory)" "python-freethreaded"
                  New-Item -ItemType Directory -Path $installer -Force | Out-Null
                  $archive = Join-Path $installer "python.tar.gz"
                  Invoke-WebRequest $files[0].download_url -OutFile $archive
                  tar -xzf $archive -C $installer
                  if ($LASTEXITCODE -ne 0) { throw "Failed to extract $($files[0].filename)." }

                  Push-Location $installer
                  try {
                    bash ./setup.sh
                    if ($LASTEXITCODE -ne 0) { throw "Python installer failed." }
                  }
                  finally {
                    Pop-Location
                  }

                  $location = Join-Path "$(Agent.ToolsDirectory)" "Python/$version/$arch"
                  Write-Host "##vso[task.setvariable variable=pythonLocation;isOutput=true]$location"
                name: Python315t
                displayName: Install Python 3.15 free-threaded

            - pwsh: |
                $pythonLocation = "$(Python315t.pythonLocation)"
                Write-Host "pythonLocation: $pythonLocation"

                $pythonExecutable = if ($IsWindows) {
                  Join-Path $pythonLocation "python.exe"
                }
                else {
                  Join-Path $pythonLocation "bin/python"
                }

                & $pythonExecutable -c 'import sys, sysconfig; print(sys.executable); print(sys.version); gil_disabled = sysconfig.get_config_var("Py_GIL_DISABLED"); print(gil_disabled); assert sys.version_info[:2] == (3, 15); assert gil_disabled == 1'
                if ($LASTEXITCODE -ne 0) {
                  throw "Python 3.15 free-threaded interpreter verification failed."
                }
              displayName: Verify Python 3.15 free-threaded

            - pwsh: |
                $pythonExecutable = if ($IsWindows) {
                  Join-Path "$(Python315t.pythonLocation)" "python.exe"
                }
                else {
                  Join-Path "$(Python315t.pythonLocation)" "bin/python"
                }

                python -m pip install "maturin~=1.15.0"
                if ($LASTEXITCODE -ne 0) {
                  throw "Failed to install Maturin."
                }
                python -m maturin build `
                  --manifest-path pyqir/Cargo.toml `
                  --release `
                  --features llvm20-1 `
                  --interpreter $pythonExecutable
                if ($LASTEXITCODE -ne 0) {
                  throw "Failed to build the ABI3T wheel."
                }

                $wheelDirectory = Join-Path "$(System.DefaultWorkingDirectory)" "target/wheels"
                $abi3tWheels = @(
                  Get-ChildItem -LiteralPath $wheelDirectory -Filter "pyqir-*-cp315-abi3.abi3t-*.whl" -File
                )
                if ($abi3tWheels.Count -ne 1) {
                  $wheelNames = $abi3tWheels.Name -join ", "
                  throw "Expected exactly one cp315-abi3.abi3t wheel, found $($abi3tWheels.Count): $wheelNames"
                }
                Write-Host "Built ABI3T wheel: $($abi3tWheels[0].FullName)"
              displayName: Build PyQIR ABI3T wheel

            - pwsh: |
                $pythonExecutable = if ($IsWindows) {
                  Join-Path "$(Python315t.pythonLocation)" "python.exe"
                }
                else {
                  Join-Path "$(Python315t.pythonLocation)" "bin/python"
                }

                ./eng/build.ps1 -taskList test-abi3t -properties @{ Python = $pythonExecutable }
              displayName: Test PyQIR ABI3T wheel

          - ${{ else }}:
            # Run the tests and examples outside the container for the Linux builds
            - pwsh: ./eng/build.ps1 -taskList test,run-examples
              displayName: Run Tests and Examples for Linux Builds

          - script: |
              dir target\wheels\*
            displayName: List Py Packages on Win
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'))

          - script: |
              ls target/wheels/*
            displayName: List Py Packages on non-Win
            condition: and(succeeded(), ne(variables['Agent.OS'], 'Windows_NT'))
