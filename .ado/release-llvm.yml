name: pyqir-llvm-$(BuildId)

trigger:
  branches:
    include:
    - main

parameters:
- name: matrix
  type: object
  default:
  - name: linux_x86_64
    poolName: 'Azure-Pipelines-DevTools-EO'
    imageName: 'ubuntu-22.04'
    os: linux
    tag: amd64
  - name: linux_aarch64
    poolName: 'Azure-Pipelines-DevTools-ARM64-EO'
    imageName: 'azurelinux-3.0-gen2-arm64'
    os: linux
    tag: arm64

# Parameters for building the LLVM image
- name: ACR_SERVER
  displayName: Azure Container Registry server
  type: string
  default: 'qdkacr-cfgqhwddajdaebhg.azurecr.io'
- name: qdkLlvmTag
  displayName: Tag for the qdk-llvm container image
  type: string
  default: 'latest'

variables:
  # If the user didn't specify a tag for the LLVM image, use the build ID as the tag.
  ${{ if eq(parameters.qdkLlvmTag, 'latest') }}:
    finalLlvmTag: $(Build.BuildId)
  ${{ else }}:
    finalLlvmTag: ${{ parameters.qdkLlvmTag }}

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  containers:
    - container: qdkImage
      image: ${{ parameters.ACR_SERVER }}/qdk-image:latest
      endpoint: qdkacr

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
      # To fetch the Universal Package from the ADO feed, Azure blob access is needed.
      # See https://eng.ms/docs/cloud-ai-platform/devdiv/one-engineering-system-1es/1es-build/cloudbuild/security/1espt-network-isolation
      networkIsolationPolicy: AzureStorage

    sdl:
      autobaseline:
        enableForGitHub: true
      sourceAnalysisPool:
        name: 'Azure-Pipelines-DevTools-EO'
        image: windows-2022
        os: windows
    stages:
    - stage: build
      displayName: Build
      jobs:
      - ${{ each target in parameters.matrix }}:
        - job: ${{ target.name }}
          pool:
            name: ${{ target.poolName }}
            image: ${{ target.imageName }}
            os: ${{ target.os }}
          timeoutInMinutes: 300
          templateContext:
            authenticatedContainerRegistries:
            - serviceConnection: qdkacr
          steps:
          - checkout: self

          - task: UniversalPackages@1
            displayName: Download LLVM source
            inputs:
              command: download
              feed: "AzureQuantum/azure-quantum"
              packageName: "llvm-source"
              packageVersion: "20.1.8" # or '*', '18.*' (wildcards supported for download)
              directory: "$(Pipeline.Workspace)/llvm-src"

          # Need to copy the LLVM source into the container before building it
          - script: |
              set -euxo pipefail
              cp -R "$(Pipeline.Workspace)/llvm-src/." "$(Build.SourcesDirectory)/.ado/images/qdk-llvm"
              ls -la "$(Build.SourcesDirectory)/.ado/images/qdk-llvm"
            displayName: Copy LLVM source into container build context

          - task: 1ES.BuildContainerImage@1
            inputs:
              path: $(Build.SourcesDirectory)/.ado/images/qdk-llvm
              image: qdk-llvm:$(finalLlvmTag)-${{ target.tag }}
          
          - task: 1ES.PushContainerImage@1
            inputs:
              image: qdk-llvm:$(finalLlvmTag)-${{ target.tag }}
              remoteImage: ${{ parameters.ACR_SERVER }}/qdk-llvm:$(finalLlvmTag)-${{ target.tag }}

      - job: publishImageManifest
        dependsOn:
        - linux_x86_64
        - linux_aarch64

        templateContext:
          authenticatedContainerRegistries:
          - serviceConnection: qdkacr
        
        pool:
          name: 'Azure-Pipelines-DevTools-EO'
          image: 'ubuntu-22.04'
          os: 'linux'

        steps:
        - bash: |
            set -euo pipefail

            ACR="${{ parameters.ACR_SERVER }}"
            IMG="qdk-llvm"
            TAG="$(finalLlvmTag)"

            # Create a manifest list that points at the already-pushed arch tags
            docker manifest create "$ACR/$IMG:$TAG" \
              "$ACR/$IMG:$TAG-amd64" \
              "$ACR/$IMG:$TAG-arm64"

            # Push the manifest list back to ACR
            docker manifest push "$ACR/$IMG:$TAG"

            # Optional: verify
            docker manifest inspect "$ACR/$IMG:$TAG"
